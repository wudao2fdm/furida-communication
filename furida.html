/* =====================================================================
 * views/transactions.js — Transactions（交易流水）
 * 按月浏览（‹ October 2026 ›导航）、payee 搜索、账户/分类筛选、
 * 行内点击切换状态（pending→cleared→reconciled，对账后锁定）。
 * 新增/编辑弹窗支持 expense / income / transfer 三种类型。
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.transactions = {
  name: 'TransactionsView',
  data() {
    return {
      ym: HL.util.currentMonthKey(),  // 当前浏览月份
      q: '',                          // payee/memo 搜索词
      fAcc: '',                       // 账户筛选
      fCat: '',                       // 分类筛选
      modal: false,
      editId: null,
      form: null                      // 交易表单
    };
  },
  computed: {
    L() { return this.$s.ledger; },
    /** 过滤 + 排序后的当月流水 */
    rows() {
      const U = HL.util;
      const q = this.q.trim().toLowerCase();
      return this.L.transactions
        .filter((t) => U.monthKey(t.date) === this.ym)
        .filter((t) => !this.fAcc || t.accountId === this.fAcc || t.toAccountId === this.fAcc)
        .filter((t) => !this.fCat || t.categoryId === this.fCat)
        .filter((t) => !q || (t.payee || '').toLowerCase().includes(q) || (t.memo || '').toLowerCase().includes(q))
        .sort(U.byDateDesc);
    },
    /** 当月（筛选后）净额 */
    net() {
      let n = 0;
      for (const t of this.rows) {
        if (t.type === 'income') n += t.amount;
        else if (t.type === 'expense') n -= t.amount;
      }
      return HL.util.round2(n);
    },
    accounts() { return this.L.accounts.filter((a) => !a.archived); },
    cats() { return this.L.categories; },
    /** Payee 历史词汇表（datalist 自动补全） */
    payeeList() { return HL.store.payees(); },
    /** 月显示名 */
    label() { return HL.util.fmtMonthLong(this.ym); }
  },
  methods: {
    prev() { this.ym = HL.util.addMonthKey(this.ym, -1); },
    next() { this.ym = HL.util.addMonthKey(this.ym, 1); },
    cur() { this.ym = HL.util.currentMonthKey(); },
    /** 金额展示：支出红 / 收入绿 / 转账灰，带符号 */
    amtClass(t) { return t.type === 'income' ? 'amt-pos' : t.type === 'expense' ? 'amt-neg' : 'amt-transfer'; },
    amtText(t) {
      const sign = t.type === 'income' ? '+' : '-';
      return sign + this.$money(t.amount);
    },
    /** payee 显示：转账显示去向 */
    payeeText(t) {
      if (t.type !== 'transfer') return t.payee;
      const to = this.L.accounts.find((a) => a.id === t.toAccountId);
      return 'Transfer → ' + (to ? to.name : '?');
    },
    catOf(t) {
      if (t.type === 'transfer') return null;
      return this.L.categories.find((c) => c.id === t.categoryId) || null;
    },
    accName(id) { const a = this.L.accounts.find((x) => x.id === id); return a ? a.name : '?'; },
    /** 打开新增/编辑弹窗 */
    open(t) {
      this.editId = t ? t.id : null;
      this.form = t ? Object.assign({}, t) : {
        type: 'expense', date: HL.util.todayISO(), amount: null,
        accountId: this.accounts[0] ? this.accounts[0].id : '',
        toAccountId: this.accounts[1] ? this.accounts[1].id : '',
        payee: '', categoryId: '', status: 'pending', memo: ''
      };
      this.modal = true;
    },
    /** 保存交易 */
    save() {
      const f = this.form;
      if (!f.amount || f.amount <= 0) { HL.store.toast('Enter an amount greater than zero.', 'error'); return; }
      if (!f.accountId) { HL.store.toast('Choose an account.', 'error'); return; }
      if (f.type === 'transfer' && f.toAccountId === f.accountId) {
        HL.store.toast('Transfer needs two different accounts.', 'error'); return;
      }
      if (f.type !== 'transfer' && !f.categoryId) { HL.store.toast('Pick a category.', 'error'); return; }
      if (this.editId) HL.store.updateTransaction(this.editId, f);
      else HL.store.addTransaction(f);
      this.modal = false;
    },
    /** 删除交易（对账交易后端会拒绝，这里前置确认） */
    async remove(t) {
      if (t.status === 'reconciled') { HL.store.toast('Reconciled transactions are locked.', 'info'); return; }
      const ok = await HL.store.askConfirm('Delete this transaction?', { danger: true, confirmText: 'Delete' });
      if (ok) HL.store.deleteTransaction(t.id);
    },
    /** 行内切换状态 */
    cycle(t) { HL.store.cycleTxStatus(t.id); },
    /** 状态图标与说明 */
    stIcon(s) { return s === 'cleared' ? 'check-circle' : s === 'reconciled' ? 'status-rec' : 'clock'; },
    stTitle(s) {
      return s === 'pending' ? 'Pending — click to mark cleared'
        : s === 'cleared' ? 'Cleared — click to reconcile'
        : 'Reconciled (locked)';
    }
  },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Transactions</div>
      <div class="page-sub">Every dollar in and out, cleared against your real accounts.</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" @click="open(null)"><x-icon name="plus"/>Add transaction</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="month-nav">
      <button class="icon-btn" @click="prev"><x-icon name="chev-l"/></button>
      <b>{{ label }}</b>
      <button class="icon-btn" @click="next"><x-icon name="chev-r"/></button>
    </div>
    <button class="btn btn-sm" @click="cur">This month</button>
    <div class="spacer"></div>
    <input class="field-input" style="min-width:180px" v-model="q" placeholder="Search payee or memo…">
    <select class="field-select" v-model="fAcc">
      <option value="">All accounts</option>
      <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}</option>
    </select>
    <select class="field-select" v-model="fCat">
      <option value="">All categories</option>
      <option v-for="c in cats" :key="c.id" :value="c.id">{{ c.icon }} {{ c.name }}</option>
    </select>
  </div>

  <div class="card">
    <table class="tbl">
      <thead><tr>
        <th style="width:100px">Date</th><th>Payee</th><th>Category</th>
        <th>Account</th><th style="width:60px">Status</th><th class="num" style="width:120px">Amount</th>
        <th style="width:76px"></th>
      </tr></thead>
      <tbody>
        <tr v-for="t in rows" :key="t.id">
          <td class="money">{{ $date(t.date) }}</td>
          <td>
            <div class="txn-payee ellipsis">{{ payeeText(t) }}</div>
            <div class="txn-memo ellipsis" v-if="t.memo">{{ t.memo }}</div>
          </td>
          <td>
            <span class="cat-tag" v-if="catOf(t)">{{ catOf(t).icon }} {{ catOf(t).name }}</span>
            <span class="text-muted" v-else>—</span>
          </td>
          <td class="text-2">{{ accName(t.accountId) }}<span v-if="t.type === 'transfer'"> → {{ accName(t.toAccountId) }}</span></td>
          <td>
            <button class="status-btn" :class="t.status" :title="stTitle(t.status)" @click="cycle(t)">
              <x-icon :name="stIcon(t.status)"/>
            </button>
          </td>
          <td class="num"><b class="money" :class="amtClass(t)">{{ amtText(t) }}</b></td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" :disabled="t.status === 'reconciled'" @click="open(t)"><x-icon name="pencil"/></button>
              <button class="icon-btn danger" :disabled="t.status === 'reconciled'" @click="remove(t)"><x-icon name="trash"/></button>
            </div>
          </td>
        </tr>
        <tr v-if="!rows.length">
          <td colspan="7"><div class="empty">No transactions in {{ label }} for this filter.</div></td>
        </tr>
      </tbody>
    </table>
    <div class="tbl-foot">
      <span>{{ rows.length }} transaction{{ rows.length === 1 ? '' : 's' }}</span>
      <span>Net: <b class="money" :class="net >= 0 ? 'amt-pos' : 'amt-neg'">{{ (net >= 0 ? '+' : '') + $money(net) }}</b></span>
    </div>
  </div>

  <!-- 新增/编辑交易 -->
  <x-modal v-if="modal" :title="editId ? 'Edit transaction' : 'Add transaction'" @close="modal = false">
    <div class="seg" style="margin-bottom:14px">
      <button :class="{on: form.type === 'expense'}" @click="form.type = 'expense'">Expense</button>
      <button :class="{on: form.type === 'income'}" @click="form.type = 'income'">Income</button>
      <button :class="{on: form.type === 'transfer'}" @click="form.type = 'transfer'">Transfer</button>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">Amount</label>
        <input class="field-input" type="number" step="0.01" min="0" v-model.number="form.amount" placeholder="0.00"></div>
      <div class="field"><label class="field-label">Date</label>
        <input class="field-input" type="date" v-model="form.date"></div>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">{{ form.type === 'transfer' ? 'From account' : 'Account' }}</label>
        <select class="field-select" v-model="form.accountId">
          <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}</option>
        </select></div>
      <div class="field" v-if="form.type === 'transfer'"><label class="field-label">To account</label>
        <select class="field-select" v-model="form.toAccountId">
          <option v-for="a in accounts" :key="a.id" :value="a.id">{{ a.name }}</option>
        </select></div>
      <div class="field" v-else><label class="field-label">Category</label>
        <select class="field-select" v-model="form.categoryId">
          <option value="">Choose…</option>
          <option v-for="c in cats" :key="c.id" :value="c.id">{{ c.icon }} {{ c.name }} ({{ c.group }})</option>
        </select></div>
    </div>
    <div class="field" v-if="form.type !== 'transfer'">
      <label class="field-label">Payee</label>
      <input class="field-input" v-model="form.payee" list="payee-options" placeholder="Start typing…">
      <datalist id="payee-options"><option v-for="p in payeeList" :key="p" :value="p"></option></datalist>
    </div>
    <div class="field-row">
      <div class="field"><label class="field-label">Status</label>
        <select class="field-select" v-model="form.status" :disabled="editId && form.status === 'reconciled'">
          <option value="pending">Pending</option>
          <option value="cleared">Cleared</option>
          <option value="reconciled" v-if="!editId || form.status === 'reconciled'">Reconciled</option>
        </select></div>
      <div class="field"><label class="field-label">Memo (optional)</label>
        <input class="field-input" v-model="form.memo" placeholder="Note for future you"></div>
    </div>
    <template #foot>
      <button class="btn" @click="modal = false">Cancel</button>
      <button class="btn btn-primary" @click="save">{{ editId ? 'Save changes' : 'Add transaction' }}</button>
    </template>
  </x-modal>
</div>`
};

/* =====================================================================
 * views/accounts.js — Accounts（账户管理）
 * 净资产横幅（资产/负债拆分）+ 账户卡片（余额、类型、开户日）
 * 新增/编辑弹窗 + 归档/取消归档（有交易的账户不可删除）
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.accounts = {
  name: 'AccountsView',
  data() { return { modal: false, editId: null, form: null }; },
  computed: {
    L() { return this.$s.ledger; },
    /** 资产/负债/净资产 */
    net() { return HL.store.assetsAndDebts(); },
    /** 活跃账户卡片（附余额与交易数） */
    active() {
      return this.L.accounts.filter((a) => !a.archived).map((a) => ({
        acc: a, bal: HL.store.accountBalance(a.id),
        txns: this.L.transactions.filter((t) => t.accountId === a.id || t.toAccountId === a.id).length
      }));
    },
    /** 已归档账户 */
    archived() { return this.L.accounts.filter((a) => a.archived); }
  },
  methods: {
    /** 类型图标底色 */
    accColor(type) {
      return { checking: '#4f46e5', savings: '#0d9488', credit: '#dc2626', cash: '#d97706' }[type] || '#64748b';
    },
    typeLabel(t) { return HL.seed.accountTypeLabel[t] || t; },
    typeIcon(t) { return HL.seed.accountTypeIcon[t] || 'bank'; },
    /** 账户余额（模板不能直接访问 HL 全局，经方法中转） */
    balanceOf(id) { return HL.store.accountBalance(id); },
    /** 余额语义：信用卡负数 = 欠款（红色），显示 |x| + owed */
    balView(r) {
      if (r.acc.type === 'credit' && r.bal < 0) {
        return { text: this.$money(Math.abs(r.bal)) + ' owed', cls: 'amt-neg' };
      }
      return { text: this.$money(r.bal), cls: r.bal < 0 ? 'amt-neg' : '' };
    },
    /** 打开新增/编辑弹窗 */
    open(a) {
      this.editId = a ? a.id : null;
      this.form = a ? { name: a.name, type: a.type, openingBalance: a.openingBalance, openedDate: a.openedDate }
        : { name: '', type: 'checking', openingBalance: null, openedDate: HL.util.todayISO() };
      this.modal = true;
    },
    /** 保存账户 */
    save() {
      if (!this.form.name) { HL.store.toast('Account name is required.', 'error'); return; }
      if (this.editId) HL.store.updateAccount(this.editId, this.form);
      else HL.store.addAccount(this.form);
      this.modal = false;
    },
    /** 归档/恢复确认 */
    async toggle(a) {
      const msg = a.archived
        ? 'Restore "' + a.name + '" to your active accounts?'
        : 'Archive "' + a.name + '"? It will be hidden but its history is kept.';
      const ok = await HL.store.askConfirm(msg, { confirmText: a.archived ? 'Restore' : 'Archive' });
      if (ok) HL.store.toggleAccountArchive(a.id);
    }
  },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Accounts</div>
      <div class="page-sub">Checking, savings, credit cards and cash — all in one picture.</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" @click="open(null)"><x-icon name="plus"/>Add account</button>
    </div>
  </div>

/* =====================================================================
 * views/budget.js — Budget（信封式月度预算）
 * 月度总额汇总 + 逐分类"预算 vs 实际"进度条（Safe to Spend）
 * 支持逐月覆盖额度（overrides）：这个月特殊，单独给这个信封多/少一点。
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.budget = {
  name: 'BudgetView',
  data() { return { ym: HL.util.currentMonthKey(), modal: false, editCat: null, form: { monthlyAmount: null, override: null } }; },
  computed: {
    L() { return this.$s.ledger; },
    label() { return HL.util.fmtMonthLong(this.ym); },
    /** 信封行（含分类信息，按消耗比例降序） */
    rows() { return HL.store.budgetRows(this.ym); },
    /** 月度预算总额与已花总额 */
    summary() {
      let budget = 0, spent = 0;
      for (const r of this.rows) { budget += r.amount; spent += r.spent; }
      return { budget: HL.util.round2(budget), spent: HL.util.round2(spent), pct: budget > 0 ? Math.round(spent / budget * 100) : 0 };
    },
    /** 尚未设置预算的支出分类（添加入口） */
    unbudgeted() {
      const has = new Set(this.L.budgets.map((b) => b.categoryId));
      return this.L.categories.filter((c) => c.group !== 'Income' && !has.has(c.id));
    }
  },
  methods: {
    prev() { this.ym = HL.util.addMonthKey(this.ym, -1); },
    next() { this.ym = HL.util.addMonthKey(this.ym, 1); },
    cur() { this.ym = HL.util.currentMonthKey(); },
    /** 剩余可花文案（负数 = 超支） */
    leftText(r) {
      return r.remaining >= 0 ? this.$money(r.remaining) + ' left' : this.$money(Math.abs(r.remaining)) + ' over';
    },
    /** 打开编辑弹窗（默认月额度 + 当月覆盖额度） */
    openEdit(r) {
      this.editCat = r.cat.id;
      // 默认额度取 budgets 中的 monthlyAmount（而非当月覆盖值），避免误改默认值
      const b = this.L.budgets.find((x) => x.categoryId === r.cat.id);
      this.form = {
        monthlyAmount: b ? b.monthlyAmount : null,
        override: r.override != null ? r.override : null
      };
      this.modal = true;
    },
    /** 为未预算分类打开新增弹窗 */
    addFor(catId) {
      this.editCat = catId;
      this.form = { monthlyAmount: null, override: null };
      this.modal = true;
    },
    /** 保存预算：写默认月额度；当月覆盖值有改动则单独保存 */
    save() {
      if (!this.form.monthlyAmount || this.form.monthlyAmount <= 0) {
        HL.store.toast('Enter a monthly amount greater than zero.', 'error');
        return;
      }
      HL.store.setBudget(this.editCat, this.form.monthlyAmount);
      if (this.form.override != null && this.form.override !== '') {
        HL.store.setBudgetOverride(this.editCat, this.ym, this.form.override);
      } else {
        HL.store.setBudgetOverride(this.editCat, this.ym, null);
      }
      this.modal = false;
    },
    /** 删除预算信封 */
    async remove() {
      const cat = this.L.categories.find((c) => c.id === this.editCat);
      const ok = await HL.store.askConfirm('Remove the budget for "' + (cat ? cat.name : '?') + '"?', { danger: true, confirmText: 'Remove' });
      if (ok) { HL.store.removeBudget(this.editCat); this.modal = false; }
    }
  },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Budget</div>
      <div class="page-sub">Envelope budgeting — give every dollar a job before the month starts.</div>
    </div>
    <div class="page-actions">
      <div class="month-nav">
        <button class="icon-btn" @click="prev"><x-icon name="chev-l"/></button>
        <b>{{ label }}</b>
        <button class="icon-btn" @click="next"><x-icon name="chev-r"/></button>
      </div>
      <button class="btn btn-sm" @click="cur">Today</button>
    </div>
  </div>

  <!-- 月度汇总 -->
  <div class="card budget-summary" v-if="rows.length">
    <div style="flex:1">
      <div class="env-top" style="margin-bottom:7px">
        <span class="env-cat">Total budgeted <span class="text-muted money">{{ $money(summary.budget) }}</span></span>
        <span class="env-nums">Spent <b class="money">{{ $money(summary.spent) }}</b> ({{ summary.pct }}%)</span>
      </div>
      <div class="progress" style="height:10px">
        <i :class="summary.pct > 100 ? 'over' : summary.pct >= 75 ? 'warn' : 'ok'" :style="{ width: Math.min(100, summary.pct) + '%' }"></i>
      </div>
    </div>
    <div style="text-align:right">
      <div class="num" :class="summary.budget - summary.spent >= 0 ? 'amt-pos' : 'amt-neg'">
        {{ summary.budget - summary.spent >= 0 ? $money(summary.budget - summary.spent) : $money(Math.abs(summary.budget - summary.spent)) }}
      </div>
      <div class="stat-label" style="margin-top:2px">{{ summary.budget - summary.spent >= 0 ? 'Safe to spend' : 'Over budget' }}</div>
    </div>
  </div>

  <!-- 信封列表 -->
  <div class="card" v-if="rows.length">
    <div v-for="r in rows" :key="r.cat.id" class="env-row">
      <div class="bill-ico" style="font-size:15px">{{ r.cat.icon }}</div>
      <div class="env-main">
        <div class="env-top">
          <span class="env-cat">{{ r.cat.name }} <span class="text-muted" style="font-weight:400">· {{ r.cat.group }}</span></span>
          <span class="env-nums">
            {{ $money(r.spent) }} of {{ $money(r.amount) }}
            <span v-if="r.override != null" class="badge badge-indigo" style="margin-left:6px">adjusted</span>
          </span>
        </div>
        <div class="progress">
          <i :class="r.pct > 100 ? 'over' : r.pct >= 75 ? 'warn' : 'ok'" :style="{ width: Math.min(100, r.pct) + '%' }"></i>
        </div>
      </div>
      <div class="env-left" :class="r.remaining >= 0 ? 'amt-pos' : 'amt-neg'">{{ leftText(r) }}</div>
      <button class="icon-btn" @click="openEdit(r)"><x-icon name="pencil"/></button>
    </div>
  </div>
  <div class="card" v-else><div class="empty">
    <div class="empty-icon">🎯</div>
    No budgets yet.<br>Pick a category below and set a monthly envelope.
  </div></div>

  <!-- 添加预算 -->
  <div class="card" style="margin-top:14px" v-if="unbudgeted.length">
    <div class="card-head"><span class="card-title">Add a budget envelope</span></div>
    <div style="padding:12px 20px 16px">
      <button v-for="c in unbudgeted" :key="c.id" class="btn btn-sm" style="margin:0 8px 8px 0" @click="addFor(c.id)">
        {{ c.icon }} {{ c.name }} <x-icon name="plus"/>
      </button>
    </div>
  </div>

  <!-- 额度编辑 -->
  <x-modal v-if="modal" :title="'Budget: ' + (L.categories.find(c => c.id === editCat) || {name:''}).name" :width="420" @close="modal = false">
    <div class="field">
      <label class="field-label">Default monthly amount</label>
      <input class="field-input" type="number" step="1" min="0" v-model.number="form.monthlyAmount">
      <div class="field-hint">Applies to every month unless you set an override below.</div>
    </div>
    <div class="field">
      <label class="field-label">{{ label }} only (override)</label>
      <input class="field-input" type="number" step="1" min="0" v-model.number="form.override" placeholder="Leave empty to use the default">
      <div class="field-hint">Useful for seasonal months — e.g. higher in December, zero while on vacation.</div>
    </div>
    <template #foot>
      <button class="btn btn-danger-ghost" style="margin-right:auto" @click="remove">Remove budget</button>
      <button class="btn" @click="modal = false">Cancel</button>
      <button class="btn btn-primary" @click="save">Save</button>
    </template>
  </x-modal>
</div>`
};

/* =====================================================================
 * views/reports.js — Reports（报表）
 * 左：当月支出分类环形图（手绘 SVG + hover 提示）
 * 右：近 12 个月收支柱状图（hover 提示）
 * 底部：12 个月均值小结
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.reports = {
  name: 'ReportsView',
  computed: {
    L() { return this.$s.ledger; },
    /** 当月月份键 */
    ym() { return HL.util.currentMonthKey(); },
    /** 环形图数据：当月支出按分类聚合，Top 8 + Other */
    donutItems() {
      const spent = HL.store.spentByCat(this.ym);
      const arr = [];
      for (const [id, v] of spent.entries()) {
        const c = this.L.categories.find((x) => x.id === id);
        arr.push({ label: c ? c.name : 'Uncategorized', color: c ? c.color : '#94a3b8', value: v });
      }
      arr.sort((a, b) => b.value - a.value);
      if (arr.length > 8) {
        const rest = arr.slice(8);
        const sum = rest.reduce((a, r) => a + r.value, 0);
        return arr.slice(0, 8).concat([{ label: 'Other', color: '#cbd5e1', value: HL.util.round2(sum) }]);
      }
      return arr;
    },
    /** 当月支出总额（环形图圆心） */
    donutTotal() {
      return this.donutItems.reduce((a, i) => a + i.value, 0);
    },
    /** 近 12 个月收支柱状图数据 */
    bars() {
      return HL.store.monthsIncomeExpense(HL.store.last12Months());
    },
    /** 12 个月均值小结 */
    averages() {
      const d = this.bars.filter((m) => m.income || m.expense);
      const n = d.length || 1;
      const income = d.reduce((a, m) => a + m.income, 0) / n;
      const expense = d.reduce((a, m) => a + m.expense, 0) / n;
      return { income, expense, net: income - expense };
    }
  },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Reports</div>
      <div class="page-sub">Where the money goes — at a glance.</div>
    </div>
  </div>

  <div class="charts-grid">
    <!-- 当月分类环形图 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">Spending by category</span>
        <span class="text-muted" style="font-size:12px">{{ $monthLong(ym) }}</span>
      </div>
      <div class="card-pad">
        <donut-chart :items="donutItems" center-label="Spent this month" :center-value="$money(donutTotal)"></donut-chart>
      </div>
      <div class="legend">
        <div class="legend-row" v-for="i in donutItems" :key="i.label">
          <span class="legend-dot" :style="{ background: i.color }"></span>
          <span class="lg-name">{{ i.label }}</span>
          <span class="lg-val">{{ $money(i.value) }}</span>
          <span class="lg-pct">{{ donutTotal ? Math.round(i.value / donutTotal * 100) : 0 }}%</span>
        </div>
      </div>
    </div>

    <!-- 12 个月趋势 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">Income vs expenses</span>
        <span style="font-size:12px">
          <span class="legend-dot" style="background:#16a34a"></span>Income&nbsp;&nbsp;
          <span class="legend-dot" style="background:#ef4444"></span>Expenses
        </span>
      </div>
      <div class="card-pad">
        <bars-chart :data="bars"></bars-chart>
      </div>
    </div>
  </div>

  <!-- 均值小结 -->
  <div class="stat-grid" style="margin-top:14px;grid-template-columns:repeat(3,1fr)">
    <div class="stat-card">
      <div class="stat-label">Avg monthly income</div>
      <div class="stat-value money amt-pos">{{ $money(averages.income) }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg monthly spending</div>
      <div class="stat-value money">{{ $money(averages.expense) }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg monthly net</div>
      <div class="stat-value money" :class="averages.net >= 0 ? 'amt-pos' : 'amt-neg'">{{ $money(averages.net) }}</div>
    </div>
  </div>
</div>`

/* =====================================================================
 * views/settings.js — Settings（设置）
 * 分区：常规（货币）/ 安全（改密码、记住我、手动锁定、安全须知）/
 *       分类管理 / 数据（Excel 导出、JSON 备份、快照恢复）
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.settings = {
  name: 'SettingsView',
  data() {
    return {
      // 修改密码表单
      pwOld: '', pwNew: '', pw2: '', pwHint: '', pwErr: '', pwBusy: false,
      // 记住我开启所需密码
      remPw: '', remErr: '', remBusy: false, remPwModal: false,
      // Excel 导出范围（默认当年 1 月到当月）
      expFrom: HL.util.currentMonthKey().slice(0, 4) + '-01',
      expTo: HL.util.currentMonthKey(),
      expBusy: false,
      // 快照列表
      snaps: [],
      // 分类管理
      newCatName: '', newCatGroup: 'Food'
    };
  },
  computed: {
    L() { return this.$s.ledger; },
    s() { return this.$s; },
    currency() { return this.L.settings.currency; },
    /** 新密码强度 */
    strength() { return HL.util.passwordStrength(this.pwNew); },
    pwOk() { return this.pwNew.length >= 8 && this.pwNew === this.pw2; },
    /** 分类按组聚合（管理界面） */
    catGroups() {
      const g = new Map();
      for (const c of this.L.categories) {
        if (!g.has(c.group)) g.set(c.group, []);
        g.get(c.group).push(c);
      }
      return Array.from(g.entries());
    }
  },
  methods: {
    /** 提交修改密码：成功后清空表单并提示（记住我会被自动清除） */
    async changePw() {
      this.pwErr = '';
      if (!this.pwOk) { this.pwErr = 'New passwords must match and be at least 8 characters.'; return; }
      this.pwBusy = true;
      try {
        await HL.store.changePassword(this.pwOld, this.pwNew, this.pwHint.trim());
        HL.store.toast('Master password changed. Remember-me was reset for security.', 'success');
        this.pwOld = this.pwNew = this.pw2 = this.pwHint = '';
      } catch (e) {
        this.pwErr = e.message === 'bad-password' ? 'Current password is incorrect.' : 'Failed: ' + e.message;
      }
      this.pwBusy = false;
    },
    /** 开启"记住我"：输入一次主密码完成密钥托管 */
    async enableRem() {
      this.remErr = ''; this.remBusy = true;
      try {
        await HL.store.enableRemember(this.remPw);
        this.remPw = '';
      } catch (e) {
        this.remErr = e.message === 'bad-password' ? 'Password is incorrect.' : 'Failed: ' + e.message;
      }
      this.remBusy = false;
    },
    /** 关闭"记住我"（确认后删除本机密钥） */
    async disableRem() {
      const ok = await HL.store.askConfirm(
        'Turn off "Remember me on this device"? You will enter the master password next time.',
        { confirmText: 'Turn off' }
      );
      if (ok) HL.store.disableRemember();
    },
    /** 手动锁定（记住我模式下被禁用，仅展示说明） */
    async lockNow() { await HL.store.lockNow(''); },
    /** 导出 Excel（月份范围） */
    async doExport() {
      if (this.expFrom > this.expTo) { HL.store.toast('The range end must be after the start.', 'error'); return; }
      this.expBusy = true;
      try {
        const name = await HL.xlsx.export(this.L, this.expFrom, this.expTo);
        HL.store.toast('Exported ' + name, 'success');
      } catch (e) {
        HL.store.toast('Export failed: ' + e.message, 'error');
      }
      this.expBusy = false;
    },
    /** 导出 JSON 备份（明文警告 -> 确认 -> 下载） */
    async doJson() {
      const ok = await HL.store.askConfirm(
        'A JSON backup is NOT encrypted — anyone who gets this file can read every transaction. Continue?',
        { title: 'Export unencrypted backup', danger: true, confirmText: 'Export anyway' }
      );
      if (ok) HL.store.exportJsonBackup();
    },
    /** 刷新快照列表（打开设置页与恢复后调用） */
    async loadSnaps() {
      try { this.snaps = await HL.idb.listSnapshots(); } catch (e) { this.snaps = []; }
    },
    /** 从快照恢复（确认 -> 整体替换并写盘） */
    async restore(snap) {
      const ok = await HL.store.askConfirm(
        'Restore the snapshot saved at ' + new Date(snap.savedAt).toLocaleString('en-US') +
        '? Your current data will be replaced by it.', { danger: true, confirmText: 'Restore' }
      );
      if (ok && (await HL.store.restoreSnapshot(snap.id))) this.loadSnaps();
    },
    /** 添加自定义分类 */
    addCat() {
      if (!this.newCatName.trim()) return;
      HL.store.addCategory(this.newCatName, this.newCatGroup);
      this.newCatName = '';
      HL.store.toast('Category added.', 'success');
    },
    /** 删除分类（有引用时后端拒绝并提示） */
    async removeCat(c) {
      const ok = await HL.store.askConfirm('Delete category "' + c.name + '"?', { danger: true, confirmText: 'Delete' });
      if (!ok) return;
      if (!HL.store.deleteCategory(c.id)) {
        HL.store.toast('This category is used by transactions, bills or budgets and cannot be deleted.', 'error');
      }
    },
    /** 切换货币（下拉） */
    setCur(e) { HL.store.setCurrency(e.target.value); }
  },
  mounted() { this.loadSnaps(); },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">Settings</div>
      <div class="page-sub">Security, data and preferences for this ledger.</div>
    </div>
  </div>

  <div class="set-grid">
    <div style="display:flex;flex-direction:column;gap:14px">
      <!-- 常规 -->
      <div class="card set-card">
        <h3>General</h3>
        <div class="set-desc">Display preferences for this ledger file.</div>
        <div class="set-row">
          <div>
            <div class="set-row-label">Currency</div>
            <div class="set-row-sub">One currency per ledger; amounts are formatted the American way.</div>
          </div>
          <select class="field-select" style="width:110px" :value="currency" @change="setCur">

/* =====================================================================
 * app.js — 根应用：创建 Vue 实例、注册全局属性与组件、启动引导
 * 全局属性（模板内直接可用）：
 *   $s  -> store 响应式状态        $st -> store（调 action）
 *   $money(v)   -> en-US 货币      $date(iso)  -> MM/DD/YYYY
 *   $dateLong(d)-> Wednesday, October 27, 2026
 *   $monthLong(ym) -> October 2026  $monthShort(ym) -> OCT
 *   $numShort(n)-> 1.2K / 3.4M（图表轴）
 *   $bytes(n)   -> 12.3 KB
 * ===================================================================== */
(function () {
  'use strict';
  const U = HL.util;

  /** 根组件：按 phase 切换界面（boot 闪屏 / 欢迎 / 向导 / 解锁 / 主界面） */
  const RootApp = {
    name: 'RootApp',
    computed: {
      phase() { return this.$s.phase; }
    },
    template: `
<div>
  <!-- 启动闪屏 -->
  <div v-if="phase === 'boot'" class="auth">
    <div class="boot-screen">
      <div class="brand-logo" style="width:52px;height:52px;margin:0 auto 14px;border-radius:14px">
        <x-icon name="wallet" :size="26"/>
      </div>
      <div class="auth-title">Home Ledger</div>
      <div class="auth-sub">Opening your private ledger…</div>
    </div>
  </div>
  <!-- 退出兜底页：浏览器不允许脚本关闭窗口时展示（数据已保存） -->
  <div v-else-if="phase === 'closed'" class="auth">
    <div class="boot-screen">
      <div class="brand-logo" style="width:52px;height:52px;margin:0 auto 14px;border-radius:14px">
        <x-icon name="wallet" :size="26"/>
      </div>
      <div class="auth-title">Home Ledger is closed</div>
      <div class="auth-sub">Your data is saved. You can close this browser tab now (Ctrl+W).</div>
    </div>
  </div>
  <view-welcome v-else-if="phase === 'welcome'"></view-welcome>
  <view-wizard v-else-if="phase === 'wizard'"></view-wizard>
  <view-unlock v-else-if="phase === 'unlock' || phase === 'locked'"></view-unlock>
  <view-shell v-else-if="phase === 'main'"></view-shell>

  <!-- 全局宿主 -->
  <toaster></toaster>
  <confirm-host></confirm-host>
</div>`
  };

  /** 创建应用实例 */
  const app = Vue.createApp(RootApp);

  // ---- 全局属性：store 与格式化工具 ----
  app.config.globalProperties.$s = HL.store.state;
  app.config.globalProperties.$st = HL.store;
  /** en-US 货币格式（跟随账本设置；无账本时按 USD） */
  app.config.globalProperties.$money = function (v) {
    const cur = (HL.store.state.ledger && HL.store.state.ledger.settings.currency) || 'USD';
    return U.fmtMoney(v, cur);
  };
  /** 短日期 MM/DD/YYYY */
  app.config.globalProperties.$date = function (iso) { return U.fmtDate(iso); };
  /** 完整星期日期（顶栏用） */
  app.config.globalProperties.$dateLong = function (d) {
    return new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).format(d);
  };
  /** 月份键 -> 完整月名 */
  app.config.globalProperties.$monthLong = function (ym) { return U.fmtMonthLong(ym); };
  /** 月份键 -> 轴用短名 */
  app.config.globalProperties.$monthShort = function (ym) { return U.fmtMonthShort(ym); };
  /** 数字短格式（图表 y 轴：1200 -> 1.2K） */
  app.config.globalProperties.$numShort = function (n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  };
  /** 字节人性化 */
  app.config.globalProperties.$bytes = function (n) { return U.fmtBytes(n); };

  // ---- 注册共享组件 ----
  app.component('x-icon', HL.components.XIcon);
  app.component('x-modal', HL.components.XModal);
  app.component('toaster', HL.components.Toaster);
  app.component('confirm-host', HL.components.ConfirmHost);
  app.component('donut-chart', HL.charts.DonutChart);
  app.component('bars-chart', HL.charts.BarsChart);

  // ---- 注册视图组件（<component :is="'view-' + view"> 动态路由） ----
  app.component('view-welcome', HL.views.welcome);
  app.component('view-wizard', HL.views.wizard);
  app.component('view-unlock', HL.views.unlock);
  app.component('view-shell', HL.views.shell);
  app.component('view-dashboard', HL.views.dashboard);
  app.component('view-bills', HL.views.bills);
  app.component('view-transactions', HL.views.transactions);
  app.component('view-accounts', HL.views.accounts);
  app.component('view-budget', HL.views.budget);
  app.component('view-reports', HL.views.reports);
  app.component('view-settings', HL.views.settings);
  app.component('view-guide', HL.views.guide);

  /** 关闭未保存变更前的离开拦截（刷新/关闭标签页保护） */
  window.addEventListener('beforeunload', (e) => {
    const s = HL.store.state;
    if (s.phase === 'main' && s.saveStatus !== 'saved') {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ---- 挂载并启动引导 ----
  app.mount('#app');
  HL.store.boot();
})();

</script>
</body>
</html>
