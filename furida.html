    credit: 'card',
    cash: 'cash'
  };

  HL.seed = S;
})();

/* =====================================================================
 * xlsx.js — Excel 导出器（fflate 压缩 + 手写 OOXML，零外部依赖）
 * 产出真正的 .xlsx（ZIP 容器），包含三个工作表：
 *   1. Transactions        选中月份范围内的全部流水明细
 *   2. Monthly Summary     按月汇总收入 / 支出 / 净现金流
 *   3. Category Breakdown  范围内支出分类占比
 * 实现要点：单元格用 inlineStr 内联字符串（免维护共享字符串表）；
 *           金额用自定义货币数字格式；日期用 Excel 序列号 + 内置短日期格式。
 * ===================================================================== */
(function () {
  'use strict';
  const X = {};
  const U = HL.util;

  /** 列号转字母：1=>A, 26=>Z, 27=>AA（OOXML 单元格引用用） */
  function colName(n) {
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  /** 货币符号映射（随账本设置切换） */
  function currencySymbol(cur) {
    return { USD: '$', EUR: '€', GBP: '£' }[cur] || '$';
  }

  /**
   * 生成单元格 XML
   * @param {number} r 行号（1 起） @param {number} c 列号（1 起）
   * @param {*} v 值：字符串=>内联文本；数字=>数值；{d:'YYYY-MM-DD'}=>Excel 日期序列
   * @param {number} s 样式索引（styles.xml 中 cellXfs 的下标），0 为默认
   */
  function cell(r, c, v, s) {
    const ref = colName(c) + r;
    const styleAttr = s ? ' s="' + s + '"' : '';
    if (v && typeof v === 'object' && v.d) {
      // 日期：Excel 序列号 = 自 1899-12-30 起的天数（含 1900 闰年 bug 的惯例补偿）
      const serial = Math.round((U.parseDate(v.d) - U.parseDate('1899-12-30')) / 86400000);
      return '<c r="' + ref + '"' + styleAttr + ' s="' + (s || 3) + '"><v>' + serial + '</v></c>';
    }
    if (typeof v === 'number' && isFinite(v)) {
      return '<c r="' + ref + '"' + styleAttr + '><v>' + v + '</v></c>';
    }
    // 文本（含空串）：inlineStr 形式
    return '<c r="' + ref + '"' + styleAttr + ' t="inlineStr"><is><t xml:space="preserve">' +
      U.xmlEsc(v == null ? '' : v) + '</t></is></c>';
  }

  /**
   * 由二维数组生成整张工作表 XML
   * @param {Array<Array>} rows 单元格矩阵，元素为值或 {v, s}（带样式）
   * @param {Array<number>} widths 每列宽度（字符数）
   */
  function sheetXml(rows, widths) {
    let body = '';
    rows.forEach((row, ri) => {
      body += '<row r="' + (ri + 1) + '">';
      row.forEach((cv, ci) => {
        if (cv && typeof cv === 'object' && !('d' in cv) && 'v' in cv) {
          body += cell(ri + 1, ci + 1, cv.v, cv.s);
        } else if (cv && typeof cv === 'object' && 'd' in cv) {
          body += cell(ri + 1, ci + 1, cv, cv.s);
        } else {
          body += cell(ri + 1, ci + 1, cv, 0);
        }
      });
      body += '</row>';
    });
    // cols 列宽 + 冻结首行（表头滚动时保持可见）
    let cols = '<cols>';
    widths.forEach((w, i) => {
      cols += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    });
    cols += '</cols>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      cols +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<sheetData>' + body + '</sheetData></worksheet>';
  }

  /**
   * 生成 styles.xml：字体 / 填充 / 边框 / 数字格式 / 单元格样式全集
   * cellXfs 下标约定：
   *   0 默认 | 1 表头（白字+品牌底+加粗） | 2 货币 | 3 短日期
   *   4 加粗文本 | 5 加粗货币（合计行） | 6 百分比 | 7 红色负数货币
   */
  function stylesXml(cur) {
    const moneyFmt = currencySymbol(cur) + '#,##0.00;[Red]-' + currencySymbol(cur) + '#,##0.00';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;' + moneyFmt + '&quot;"/></numFmts>' +
      '<fonts count="3">' +
      '<font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
      '</fonts>' +
      '<fills count="3">' +
      '<fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF4F46E5"/><bgColor indexed="64"/></patternFill></fill>' +
      '</fills>' +
      '<borders count="2">' +
      '<border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border><left style="thin"><color rgb="FFD9DDE3"/></left><right style="thin"><color rgb="FFD9DDE3"/></right><top style="thin"><color rgb="FFD9DDE3"/></top><bottom style="thin"><color rgb="FFD9DDE3"/></bottom><diagonal/></border>' +
      '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="8">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' + // 0
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' + // 1 header
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' + // 2 money
      '<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' + // 3 date (builtin mm/dd/yyyy)
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>' + // 4 bold
      '<xf numFmtId="164" fontId="2" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1"/>' + // 5 bold money
      '<xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' + // 6 percent 0%
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>' + // 7 bordered
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';
  }

  /** 交易状态英文显示 */
  function statusLabel(s) {
    return { pending: 'Pending', cleared: 'Cleared', reconciled: 'Reconciled' }[s] || s;
  }

  /** 交易类型英文显示 */
  function typeLabel(t) {
    return { expense: 'Expense', income: 'Income', transfer: 'Transfer' }[t] || t;
  }

  /**
   * 组装并下载 .xlsx 报表
   * @param {object} ledger 账本对象
   * @param {string} fromYm 起始月份键 'YYYY-MM'（含）
   * @param {string} toYm   结束月份键 'YYYY-MM'（含）
   */
  X.export = async function (ledger, fromYm, toYm) {
    const cur = ledger.settings.currency || 'USD';
    const catById = new Map(ledger.categories.map((c) => [c.id, c]));
    const accById = new Map(ledger.accounts.map((a) => [a.id, a]));

    // —— 月份序列（from..to 逐月） ——
    const months = [];
    for (let m = fromYm; m <= toYm; m = U.addMonthKey(m, 1)) {
      months.push(m);
      if (months.length > 600) break; // 防御性上限，避免异常范围拖死浏览器
    }
    const monthSet = new Set(months);
    const inRange = ledger.transactions.filter((t) => monthSet.has(U.monthKey(t.date)));

    // ===== Sheet 1: Transactions 明细 =====
    const rows1 = [[
      { v: 'Date', s: 1 }, { v: 'Type', s: 1 }, { v: 'Account', s: 1 }, { v: 'Payee', s: 1 },
      { v: 'Category', s: 1 }, { v: 'Status', s: 1 }, { v: 'Amount', s: 1 }, { v: 'Memo', s: 1 }
    ]];
    const sorted = inRange.slice().sort(U.byDateAsc);
    for (const t of sorted) {
      const cat = catById.get(t.categoryId);
      // 金额符号按"主账户"视角：支出为负、收入为正、转账为负（从转出账户看）
      let amount = t.amount;
      if (t.type === 'expense') amount = -Math.abs(t.amount);
      const payee = t.type === 'transfer'
        ? 'Transfer to ' + (accById.get(t.toAccountId) || { name: '?' }).name
        : t.payee;
      rows1.push([
        { v: t.date, s: 3 },
        typeLabel(t.type),
        (accById.get(t.accountId) || { name: '?' }).name,
        payee || '',
        t.type === 'transfer' ? '' : (cat ? cat.name : 'Uncategorized'),
        statusLabel(t.status),
        { v: U.round2(amount), s: 2 },
        t.memo || ''
      ]);
    }

    // ===== Sheet 2: Monthly Summary 月度汇总 =====
    const rows2 = [[
      { v: 'Month', s: 1 }, { v: 'Income', s: 1 }, { v: 'Expenses', s: 1 }, { v: 'Net', s: 1 }
    ]];
    let totInc = 0, totExp = 0;
    for (const ym of months) {
      const inc = ledger.transactions
        .filter((t) => t.type === 'income' && U.monthKey(t.date) === ym)
        .reduce((a, t) => a + t.amount, 0);
      const exp = ledger.transactions
        .filter((t) => t.type === 'expense' && U.monthKey(t.date) === ym)
        .reduce((a, t) => a + t.amount, 0);
      totInc += inc; totExp += exp;
      rows2.push([
        U.fmtMonthLong(ym),
        { v: U.round2(inc), s: 2 },
        { v: U.round2(exp), s: 2 },
        { v: U.round2(inc - exp), s: 2 }
      ]);
    }
    rows2.push([
      { v: 'Total', s: 4 },
      { v: U.round2(totInc), s: 5 },
      { v: U.round2(totExp), s: 5 },
      { v: U.round2(totInc - totExp), s: 5 }
    ]);

    // ===== Sheet 3: Category Breakdown 分类占比（范围口径） =====
    const byCat = new Map();
    for (const t of inRange) {
      if (t.type !== 'expense') continue;
      const id = t.categoryId || '_uncat';
      byCat.set(id, (byCat.get(id) || 0) + t.amount);
    }
    const catRows = Array.from(byCat.entries())
      .map(([id, sum]) => {
        const c = catById.get(id);
        return { name: c ? c.name : 'Uncategorized', group: c ? c.group : '—', sum };
      })
      .sort((a, b) => b.sum - a.sum);
    const grand = catRows.reduce((a, r) => a + r.sum, 0) || 1;
    const rows3 = [[
      { v: 'Category', s: 1 }, { v: 'Group', s: 1 }, { v: 'Total Spent', s: 1 }, { v: '% of Expenses', s: 1 }
    ]];
    for (const r of catRows) {
      rows3.push([r.name, r.group, { v: U.round2(r.sum), s: 2 }, { v: r.sum / grand, s: 6 }]);
    }
    rows3.push([
      { v: 'Total', s: 4 }, '', { v: U.round2(grand), s: 5 }, { v: 1, s: 6 }
    ]);

    // ===== 打包 OOXML 文件集 =====
    const files = {};
    files['[Content_Types].xml'] =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';
    files['_rels/.rels'] =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
    files['xl/workbook.xml'] =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' +
      '<sheet name="Transactions" sheetId="1" r:id="rId1"/>' +
      '<sheet name="Monthly Summary" sheetId="2" r:id="rId2"/>' +
      '<sheet name="Category Breakdown" sheetId="3" r:id="rId3"/>' +
      '</sheets></workbook>';
    files['xl/_rels/workbook.xml.rels'] =
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>' +
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/>' +
      '<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';
    files['xl/styles.xml'] = stylesXml(cur);
    files['xl/worksheets/sheet1.xml'] = sheetXml(rows1, [12, 10, 20, 26, 20, 12, 14, 36]);
    files['xl/worksheets/sheet2.xml'] = sheetXml(rows2, [18, 14, 14, 14]);
    files['xl/worksheets/sheet3.xml'] = sheetXml(rows3, [26, 18, 14, 16]);

    // fflate 同步压缩为 ZIP（xlsx 本质是 ZIP 容器）
    const zipped = fflate.zipSync(
      Object.fromEntries(Object.entries(files).map(([k, v]) => [k, fflate.strToU8(v)])),
      { level: 6 }
    );

    // 文件名：单月 => HomeLedger_October_2026.xlsx；区间 => _Jan2026_to_Jun2026
    const label = fromYm === toYm
      ? U.fmtMonthLong(fromYm).replace(' ', '_')
      : U.fmtMonthShort(fromYm) + U.fmtMonthLong(fromYm).slice(-4) + '_to_' +
        U.fmtMonthShort(toYm) + U.fmtMonthLong(toYm).slice(-4);
    const fname = 'HomeLedger_Report_' + label.replace(/[^A-Za-z0-9_]/g, '') + '.xlsx';
    HL.files.downloadBytes(zipped, fname,
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    return fname;
  };

  HL.xlsx = X;
})();

/* =====================================================================
 * store.js — 响应式全局 Store（唯一数据源）
 * 结构：
 *   - state   : Vue.reactive 状态（账本数据 + 运行时 UI 状态）
 *   - rt      : 非响应式运行时密钥/句柄（密钥绝不进响应式系统，降低暴露面）
 *   - actions : 业务操作（增删改账户/流水/账单/预算/分类、密码管理、
 *               自动保存、快照、记住我、锁屏）
 * 约定：视图层只读 state 并调用 actions；所有变更经 touch() 触发防抖自动保存。
 * ===================================================================== */
(function () {
  'use strict';
  const U = HL.util;

  /** 运行时敏感态（非响应式）：密钥 / 盐 / 句柄 / 最近文件字节 */
  const rt = {
    key: null,        // 当前 AES-256-GCM CryptoKey（解锁后缓存，自动保存复用）
    salt: null,       // 当前文件头的盐
    hint: '',         // 当前密码提示语（写入文件头）
    handle: null,     // FileSystemFileHandle（FS Access API 模式）
    lastBytes: null,  // 最近一次完整文件字节（锁屏后重解锁 / 降级模式保存用）
    newLedger: null,  // 向导暂存：新建账本对象
    newKey: null, newSalt: null, newBytes: null, newHint: '',
    idleTimer: null,  // 空闲锁屏定时器
    lastActivity: Date.now()
  };

  /** 响应式全局状态（视图模板通过 $s 访问） */
  const state = Vue.reactive({
    phase: 'boot',          // boot | welcome | wizard | unlock | locked | main
    view: 'dashboard',      // main 阶段的左侧导航选中项
    ledger: null,           // 账本数据（解锁后填充）
    saveStatus: 'saved',    // idle | dirty | saving | saved | error
    saveError: '',          // 保存失败的详细信息（顶栏提示）
    fileName: '',           // 账本文件名（展示）
    hint: '',               // 解锁界面展示的密码提示
    rememberEnabled: false, // "在此设备上记住我"是否生效
    fallback: !HL.files.supported(), // 浏览器降级模式（无 FS Access API）
    hasSavedHandle: false,  // IndexedDB 中是否有上次账本句柄
    savedHandleName: '',    // 上次账本文件名（欢迎页"继续"按钮展示）
    needsPermission: false, // 句柄需要用户手势重新授权
    lockMessage: '',        // 锁屏界面副标题（自动锁屏原因）
    wizardStep: 1,          // 新建向导步骤（1 密码 2 位置）
    toasts: [],             // 全局通知队列
    confirm: null           // 全局确认框 { message, confirmText, danger, resolve }
  });

  /** 标记数据已变更：刷新 meta.updatedAt 并调度防抖自动保存 */
  function touch() {
    if (!state.ledger) return;
    state.ledger.meta.updatedAt = new Date().toISOString();
    state.saveStatus = 'dirty';
    scheduleSave();
  }

  /** 防抖 800ms 自动保存（设计文档规定值） */
  const scheduleSave = U.debounce(() => { persistNow().catch(() => {}); }, 800);

  /**
   * 立即加密并写盘（自动保存 / 关键操作后的统一落盘路径）
   * FS 模式：原地覆写用户文件 + 记录加密快照；降级模式：仅标记等待手动下载。
   * @returns {Promise<boolean>} 是否成功
   */
  async function persistNow() {
    if (!state.ledger || !rt.key) return false;
    if (!rt.handle) {
      // 降级模式：无句柄可写，等待用户点击"下载保存"
      return false;
    }
    state.saveStatus = 'saving';
    try {
      const bytes = await HL.crypto.encryptLedgerWithKey(state.ledger, rt.key, rt.salt, rt.hint);
      await HL.files.writeHandle(rt.handle, bytes);
      rt.lastBytes = bytes;
      await HL.idb.addSnapshot(bytes, state.fileName).catch(() => {}); // 快照失败不影响主流程
      state.saveStatus = 'saved';
      state.saveError = '';
      return true;
    } catch (e) {
      state.saveStatus = 'error';
      state.saveError = 'Could not save: the file may have been moved or access was revoked.';
      return false;
    }
  }

  /** 降级模式手动保存：加密后经浏览器下载落盘 */
  function saveByDownload() {
    if (!state.ledger || !rt.key) return;
    HL.crypto.encryptLedgerWithKey(state.ledger, rt.key, rt.salt, rt.hint).then((bytes) => {
      rt.lastBytes = bytes;
      HL.files.downloadBytes(bytes, state.fileName || 'FamilyLedger.hledger');
      state.saveStatus = 'saved';
      toast('Ledger file downloaded. Keep it in a place you can find.', 'info');
      HL.idb.addSnapshot(bytes, state.fileName).catch(() => {});
    });
  }

  /**
   * 采用（adopt）一份已解密账本：填充响应式状态并进入主界面
   * 同时核对"记住我"记录是否与当前密码一致（改过密码则自动清除）
   */
  async function adoptLedger(ledgerObj, key, salt, hint) {
    state.ledger = ledgerObj;
    // 账本自带主题偏好（旧文件没有该字段时回退日间），打开即应用
    applyTheme((ledgerObj.settings && ledgerObj.settings.theme) || 'day');
    rt.key = key;
    rt.salt = salt;
    rt.hint = hint || '';
    state.hint = hint || '';
    state.phase = 'main';
    state.view = 'dashboard';
    state.saveStatus = 'saved';
    state.saveError = '';
    // 校验记住我记录：与当前文件不再匹配（改密/换文件）时自动清除并提示
    const rem = await HL.idb.getRemember().catch(() => null);
    if (rem) {
      const ok = await HL.crypto.checkVerifier(rem.key, rem.verifier);
      if (ok) {
        state.rememberEnabled = true;
      } else {
        await HL.idb.clearRemember().catch(() => {});
        state.rememberEnabled = false;
        toast('"Remember me on this device" was turned off because the password changed.', 'info');
      }
    } else {
      state.rememberEnabled = false;
    }
  }

  /**
   * 尝试"记住我"免密解锁：校验值验证 -> 直接试解账本文件
   * @returns {Promise<boolean>} true=已进入主界面；false=回退到密码解锁
   */
  async function tryRememberUnlock(bytes) {
    const rem = await HL.idb.getRemember().catch(() => null);
    if (!rem || !rem.key) return false;
    try {
      const ok = await HL.crypto.checkVerifier(rem.key, rem.verifier);
      if (!ok) return false;
      const res = await HL.crypto.decryptLedgerWithKey(bytes, rem.key);
      const h = HL.crypto.unpackLedger(bytes);
      await adoptLedger(res.ledger, rem.key, h.salt, res.hint);
      return true;
    } catch (e) {
      return false; // 换了文件 / 改过密码：静默回退到密码路径
    }
  }

  /** 从文件字节进入"解锁"界面（解析头部拿到明文密码提示语） */
  function gotoUnlock(bytes) {
    rt.lastBytes = bytes;
    try {
      const h = HL.crypto.unpackLedger(bytes);
      state.hint = h.hint || '';
    } catch (e) {
      state.hint = '';
    }
    state.phase = 'unlock';
  }

  /** 读取句柄文件并推进解锁流程（记住我优先，失败转密码） */
  async function readAndResume(handle) {
    const bytes = await HL.files.readHandle(handle);
    rt.handle = handle;
    state.fileName = handle.name || state.savedHandleName;
    if (await tryRememberUnlock(bytes)) return true;
    gotoUnlock(bytes);
    return false;
  }

  /**
   * 应用启动引导：检查句柄/记住我，决定进入欢迎页还是直接恢复
   * FS 模式：句柄权限已授予且记住我生效时可全自动进入；否则停在中转页。
   */
  async function boot() {
    if (state.fallback) { state.phase = 'welcome'; return; } // 降级模式无句柄恢复能力
    let rec = null;
    try { rec = await HL.idb.getHandle(); } catch (e) { rec = null; }
    if (!rec || !rec.handle) { state.phase = 'welcome'; return; }
    state.hasSavedHandle = true;
    state.savedHandleName = rec.name || rec.handle.name || 'your ledger';
    try {
      const perm = await rec.handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        rt.handle = rec.handle;
        state.fileName = state.savedHandleName;
        const bytes = await HL.files.readHandle(rec.handle);
        if (!(await tryRememberUnlock(bytes))) gotoUnlock(bytes);
      } else {
        state.needsPermission = true; // 欢迎页展示"Continue with ..."按钮（用户手势授权）
        state.phase = 'welcome';
      }
    } catch (e) {
      // 句柄失效（文件被删/移动）：清掉旧句柄，回到欢迎页
      await HL.idb.clearHandle().catch(() => {});
      state.hasSavedHandle = false;
      state.phase = 'welcome';
    }
  }

  /** 欢迎页"继续上次的账本"：用户手势触发授权，成功后进入解锁/主界面 */
  async function continueWithSavedHandle() {
    try {
      const rec = await HL.idb.getHandle();
      if (!rec || !rec.handle) return;
      const ok = await HL.files.ensurePermission(rec.handle);
      if (!ok) { toast('Permission denied. Pick the file manually instead.', 'error'); return; }
      state.needsPermission = false;
      await readAndResume(rec.handle);
    } catch (e) {
      toast('Could not open the saved ledger: ' + e.message, 'error');
    }
  }

  /** 欢迎页"打开已有账本"（FS 模式：系统选择器；降级：input file） */
  async function openExisting() {
    try {
      if (state.fallback) {
        const picked = await HL.files.pickOpenFallback();
        if (!picked) return;
        state.fileName = picked.name;
        if (!(await tryRememberUnlock(picked.bytes))) gotoUnlock(picked.bytes);
        return;
      }
      const handle = await HL.files.pickOpenFile();
      if (!handle) return;
      await HL.idb.saveHandle(handle, handle.name); // 记住新选择的文件
      state.hasSavedHandle = true;
      state.savedHandleName = handle.name;
      await readAndResume(handle);
    } catch (e) {
      toast('Could not open the file: ' + e.message, 'error');
    }
  }

  /**
   * 新建向导第 1 步：用主密码加密全新种子账本（暂存，待选位置后写盘）
   * @returns {Promise<void>} 失败抛错由向导界面提示
   */
  async function prepareNewLedger(password, hint) {
    const obj = HL.seed.buildLedger();
    const { bytes, key, salt } = await HL.crypto.encryptLedger(obj, password, hint || '');
    rt.newLedger = obj;
    rt.newKey = key;
    rt.newSalt = salt;
    rt.newBytes = bytes;
    rt.newHint = hint || '';
  }

  /**
   * 新建向导第 2 步：选择保存位置并写入首个加密文件，随后进入主界面
   * @param {FileSystemFileHandle|null} handle 已选句柄（FS 模式）；降级模式传 null
   */
  async function commitNewLedger(handle) {
    if (handle) {
      await HL.files.writeHandle(handle, rt.newBytes);
      await HL.idb.saveHandle(handle, handle.name).catch(() => {});
      rt.handle = handle;
      state.fileName = handle.name || 'FamilyLedger.hledger';
    } else {
      // 降级模式：初始文件直接下载，用户需自行妥善保存
      HL.files.downloadBytes(rt.newBytes, 'FamilyLedger.hledger');
      rt.handle = null;
      state.fileName = 'FamilyLedger.hledger';
    }
    await adoptLedger(rt.newLedger, rt.newKey, rt.newSalt, rt.newHint);
    rt.lastBytes = rt.newBytes;
    await HL.idb.addSnapshot(rt.newBytes, state.fileName).catch(() => {});
    // 清理向导暂存
    rt.newLedger = null; rt.newKey = null; rt.newSalt = null; rt.newBytes = null; rt.newHint = '';
    toast('Your encrypted ledger is ready. Welcome aboard!', 'success');
  }

  /**
   * 密码解锁（解锁页 / 锁屏页共用）
   * @throws 保持原始错误（'bad-password' 等）由界面转译为提示
   */
  async function unlock(password) {
    if (!rt.lastBytes) {
      // 极端情况（内存中无文件字节）：尝试从句柄重读
      if (rt.handle) rt.lastBytes = await HL.files.readHandle(rt.handle);
      else throw new Error('no-file');
    }
    const res = await HL.crypto.decryptLedger(rt.lastBytes, password);
    const h = HL.crypto.unpackLedger(rt.lastBytes);
    await adoptLedger(res.ledger, res.key, h.salt, res.hint);
  }

  /**
   * 手动/自动锁屏：先尽力保存未落盘变更，然后清空内存中的密钥与明文账本
   * @param {string} message 锁屏界面副标题（自动锁屏原因说明）
   * @returns {Promise<boolean>} false=保存失败未锁（防数据丢失优先）
   */
  async function lockNow(message) {
    if (state.ledger && rt.key && state.saveStatus === 'dirty') {
      const ok = await persistNow();
      if (!ok) {
        toast('Save failed — fix the file location before locking.', 'error');
        return false;
      }
    }
    rt.key = null;              // 清密钥
    state.ledger = null;        // 清明文账本
    state.lockMessage = message || '';
    state.phase = 'locked';
    return true;
  }

  /** 保存失败后的"重新定位文件"：选择新位置并写回当前数据 */
  async function relocateFile() {
    const handle = await HL.files.pickOpenFile();
    if (!handle) return false;
    rt.handle = handle;
    state.fileName = handle.name;
    await HL.idb.saveHandle(handle, handle.name).catch(() => {});
    const ok = await persistNow();
    if (ok) toast('Ledger is being saved to the new location.', 'success');
    return ok;
  }

  /* ==================== 账户（Accounts） ==================== */

  /** 新增账户 */
  function addAccount(a) {
    state.ledger.accounts.push({
      id: U.uid(), name: a.name, type: a.type,
      openingBalance: U.round2(a.openingBalance), openedDate: a.openedDate || U.todayISO(),
      archived: false
    });
    touch();
  }

  /** 更新账户基本信息（名称/类型/期初/开户日） */
  function updateAccount(id, patch) {
    const acc = state.ledger.accounts.find((x) => x.id === id);
    if (!acc) return;
    Object.assign(acc, {
      name: patch.name, type: patch.type,
      openingBalance: U.round2(patch.openingBalance), openedDate: patch.openedDate
    });
    touch();
  }

  /** 归档 / 取消归档账户（有交易的账户不可删，只能归档隐藏） */
  function toggleAccountArchive(id) {
    const acc = state.ledger.accounts.find((x) => x.id === id);
    if (!acc) return;
    acc.archived = !acc.archived;
    touch();
  }

  /* ==================== 交易（Transactions） ==================== */

  /** 新增交易（对象字段由视图表单校验后传入） */
  function addTransaction(t) {
    state.ledger.transactions.push({
      id: U.uid(), date: t.date, type: t.type,
      amount: U.round2(Math.abs(t.amount)),
      accountId: t.accountId, toAccountId: t.type === 'transfer' ? t.toAccountId : undefined,
      payee: (t.payee || '').trim(), categoryId: t.type === 'transfer' ? undefined : t.categoryId,
      status: t.status || 'pending', memo: t.memo || '', billId: undefined
    });
    touch();
  }

  /** 更新交易（已对账 reconciled 的交易由界面禁止进入编辑） */
  function updateTransaction(id, patch) {
    const t = state.ledger.transactions.find((x) => x.id === id);
    if (!t || t.status === 'reconciled') return;
    Object.assign(t, {
      date: patch.date, type: patch.type,
      amount: U.round2(Math.abs(patch.amount)),
      accountId: patch.accountId,
      toAccountId: patch.type === 'transfer' ? patch.toAccountId : undefined,
      payee: (patch.payee || '').trim(),
      categoryId: patch.type === 'transfer' ? undefined : patch.categoryId,
      status: patch.status, memo: patch.memo || ''
    });
    touch();
  }

  /** 删除交易（已对账的交易禁止删除，保护历史报表数字） */
  function deleteTransaction(id) {
    const t = state.ledger.transactions.find((x) => x.id === id);
    if (!t || t.status === 'reconciled') return;
    const i = state.ledger.transactions.indexOf(t);
    state.ledger.transactions.splice(i, 1);
    touch();
  }

  /**
   * 行内循环切换交易状态：pending -> cleared -> reconciled
   * reconciled 为终态：再次点击不回退（锁定语义），界面提示
   */
  function cycleTxStatus(id) {
    const t = state.ledger.transactions.find((x) => x.id === id);
    if (!t) return;
    if (t.status === 'reconciled') {
      toast('Reconciled transactions are locked to protect your records.', 'info');
      return;
    }
    t.status = t.status === 'pending' ? 'cleared' : 'reconciled';
    touch();
  }

  /* ==================== 账单（Bills） ==================== */

  /** 新增循环账单 */
  function addBill(b) {
    state.ledger.bills.push({
      id: U.uid(), name: b.name, payee: b.payee, categoryId: b.categoryId,
      accountId: b.accountId, amount: U.round2(b.amount), isEstimate: !!b.isEstimate,
      frequency: b.frequency, nextDueDate: b.nextDueDate, autoPay: !!b.autoPay,
      reminderDays: Number(b.reminderDays) || 3, url: b.url || ''
    });
    touch();
  }

  /** 更新账单 */
  function updateBill(id, patch) {
    const b = state.ledger.bills.find((x) => x.id === id);
    if (!b) return;
    Object.assign(b, {
      name: patch.name, payee: patch.payee, categoryId: patch.categoryId,
      accountId: patch.accountId, amount: U.round2(patch.amount),
      isEstimate: !!patch.isEstimate, frequency: patch.frequency,
      nextDueDate: patch.nextDueDate, autoPay: !!patch.autoPay,
      reminderDays: Number(patch.reminderDays) || 3, url: patch.url || ''
    });
    touch();
  }

  /** 删除账单（历史交易保留，仅移除后续提醒） */
  function deleteBill(id) {
    const i = state.ledger.bills.findIndex((x) => x.id === id);
    if (i >= 0) {
      state.ledger.bills.splice(i, 1);
      touch();
    }
  }

  /**
   * 账单"标记已付"：生成一笔支出交易（回链 billId），
   * 并把 nextDueDate 按周期推进一次（推进基准=原到期日，漏付会再次变 Overdue）
   */
  function markBillPaid(billId, opts) {
    const b = state.ledger.bills.find((x) => x.id === billId);
    if (!b) return;
    const txn = {
      id: U.uid(),
      date: opts.date || U.todayISO(),
      type: 'expense',
      amount: U.round2(opts.amount != null ? opts.amount : b.amount),
      accountId: opts.accountId || b.accountId,
      payee: b.payee,
      categoryId: b.categoryId,
      status: 'cleared',
      memo: 'Payment: ' + b.name,
      billId: b.id
    };
    state.ledger.transactions.push(txn);
    b.nextDueDate = U.advanceByFrequency(b.nextDueDate, b.frequency);
    b.isEstimate = false; // 实付过一次后默认按实付金额记
    if (opts.amount != null) b.amount = U.round2(opts.amount);
    touch();
  }

  /* ==================== 预算（Budgets） ==================== */

  /** 为分类设置月度预算（已存在则更新额度） */
  function setBudget(categoryId, monthlyAmount) {
    const b = state.ledger.budgets.find((x) => x.categoryId === categoryId);
    if (b) {
      b.monthlyAmount = U.round2(monthlyAmount);
    } else {
      state.ledger.budgets.push({ categoryId, monthlyAmount: U.round2(monthlyAmount), overrides: {} });
    }
    touch();
  }

  /** 为指定月份设置单独额度（覆盖默认月度值，信封的"这个月多给点"） */
  function setBudgetOverride(categoryId, ym, amount) {
    const b = state.ledger.budgets.find((x) => x.categoryId === categoryId);
    if (!b) return;
    if (!b.overrides) b.overrides = {};
    if (amount == null || amount === '') delete b.overrides[ym];
    else b.overrides[ym] = U.round2(amount);
    touch();
  }

  /** 删除某分类的预算 */
  function removeBudget(categoryId) {
    const i = state.ledger.budgets.findIndex((x) => x.categoryId === categoryId);
    if (i >= 0) {
      state.ledger.budgets.splice(i, 1);
      touch();
    }
  }

  /* ==================== 分类（Categories） ==================== */

  /** 新增自定义分类（组内自动配色/图标） */
  function addCategory(name, group) {
    const id = 'cat-' + U.uid().slice(0, 8);
    state.ledger.categories.push({
      id, name: name.trim(), group,
      icon: (HL.seed.CATEGORIES.find((g) => g.group === group) || { icon: '📦' }).icon,
      color: HL.seed.groupColor(group)
    });
    touch();
    return id;
  }

  /** 删除分类：仅当没有任何交易/账单/预算引用时允许（历史数字不漂移） */
  function deleteCategory(id) {
    const used = state.ledger.transactions.some((t) => t.categoryId === id) ||
                 state.ledger.bills.some((b) => b.categoryId === id) ||
                 state.ledger.budgets.some((b) => b.categoryId === id);
    if (used) return false;
    const i = state.ledger.categories.findIndex((c) => c.id === id);
    if (i >= 0) {
      state.ledger.categories.splice(i, 1);
      touch();
    }
    return true;
  }

  /* ==================== 设置 / 安全 ==================== */

  /** 切换货币（全账本统一展示格式） */
  function setCurrency(cur) {
    state.ledger.settings.currency = cur;
    touch();
  }

  /**
   * 把主题写到文档根节点，样式表通过 html[data-theme="night"] 切换整套配色。
   * @param {string} theme 'day' | 'night'
   */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'night' ? 'night' : 'day');
  }

  /**
   * 切换日间 / 夜间模式：写入账本设置（随文件一起加密保存）并立即生效。
   * @param {string} theme 'day' | 'night'
   * @returns {string} 实际生效的主题
   */
  function setTheme(theme) {
    const t = theme === 'night' ? 'night' : 'day';
    if (state.ledger) {
      state.ledger.settings.theme = t;
      touch();
    }
    applyTheme(t);
    return t;
  }

  /**
   * 退出应用：二次确认 -> 落盘未保存变更 -> 尝试关闭窗口。
   * 浏览器通常只允许"由脚本打开的窗口"自我关闭，被拦截时进入 closed 阶段，
   * 展示"已退出"提示页，由用户手动关闭标签页（数据已保存，不会丢失）。
   */
  async function exitApp() {
    // 降级模式（无法原地写盘）时，未下载的改动会丢失，提示语要更明确
    const unsavedFallback = state.fallback && state.saveStatus !== 'saved';
    const msg = unsavedFallback
      ? 'Exit Home Ledger? Your latest changes have not been downloaded and will be lost.'
      : 'Exit Home Ledger? Unsaved changes will be written to the ledger file first.';
    const ok = await askConfirm(msg, { title: 'Exit Home Ledger', confirmText: 'Exit' });
    if (!ok) return;
    // 有句柄且存在未保存改动时先落盘；落盘失败则不退出，避免丢数据
    if (state.saveStatus !== 'saved' && rt.handle) {
      const saved = await persistNow().catch(() => false);
      if (!saved) {
        toast('Could not save before exit. Your changes are still open — try "Fix location" first.', 'error');
        return;
      }
    }
    try { window.close(); } catch (e) { /* 部分浏览器禁止脚本关闭窗口，忽略即可 */ }
    // 关闭若被浏览器拦截，兜底切到"已退出"提示页
    setTimeout(() => { state.phase = 'closed'; }, 120);
  }

  /**
   * 修改主密码：旧密码验证 -> 新盐新密钥全量重加密 -> 原子写盘 -> 换运行时密钥
   * 成功后清除"记住我"记录（旧密钥已失效），并提示用户。
   * @throws 'bad-password' 旧密码错误时抛出
   */
  async function changePassword(oldPw, newPw, newHint) {
    if (!rt.lastBytes && rt.handle) rt.lastBytes = await HL.files.readHandle(rt.handle);
    // 1) 用旧密码验证（解密一次最近文件字节）
    await HL.crypto.decryptLedger(rt.lastBytes, oldPw); // 失败抛 bad-password
    // 2) 生成新盐新密钥并重加密当前内存账本
    const newSalt = HL.crypto.randomBytes(16);
    const newKey = await HL.crypto.deriveKey(newPw, newSalt, HL.crypto.ITERATIONS || 600000);
    const bytes = await HL.crypto.encryptLedgerWithKey(state.ledger, newKey, newSalt, newHint || '');
    // 3) 先写盘成功再切换运行时密钥（失败则保持旧密码不变，数据一致）
    if (rt.handle) await HL.files.writeHandle(rt.handle, bytes);
    rt.key = newKey;
    rt.salt = newSalt;
    rt.hint = newHint || '';
    rt.lastBytes = bytes;
    state.hint = rt.hint;
    await HL.idb.addSnapshot(bytes, state.fileName).catch(() => {});
    // 4) 旧记住我密钥已失效：清除
    await HL.idb.clearRemember().catch(() => {});
    state.rememberEnabled = false;
    state.saveStatus = 'saved';
    return true;
  }

  /**
   * 开启"在此设备上记住我"：用当前文件盐派生密钥存入 IndexedDB + 校验值
   * @throws 密码错误时抛 'bad-password'
   */
  async function enableRemember(password) {
    if (state.fallback) throw new Error('fallback-unsupported');
    const testKey = await HL.crypto.deriveKey(password, rt.salt, 600000);
    // 验证输入的密码确实正确（用派生密钥试解一次当前文件）
    const check = await HL.crypto.decryptLedgerWithKey(rt.lastBytes, testKey);
    void check;
    const verifier = await HL.crypto.makeVerifier(testKey);
    await HL.idb.saveRemember({
      key: testKey, verifier,
      enabledAt: new Date().toISOString(),
      fileName: state.fileName
    });
    state.rememberEnabled = true;
    toast('You will be signed in automatically on this device.', 'success');
    return true;
  }

  /** 关闭"在此设备上记住我"：删除本机密钥（账本文件不受影响） */
  async function disableRemember() {
    await HL.idb.clearRemember().catch(() => {});
    state.rememberEnabled = false;
    toast('Remember me turned off. You will be asked for the password next time.', 'info');
  }

  /** 导出 JSON 备份（明文！下载前由界面二次警告） */
  function exportJsonBackup() {
    const json = JSON.stringify(state.ledger, null, 2);
    const d = U.todayISO().replace(/-/g, '');
    HL.files.downloadBytes(new TextEncoder().encode(json), 'HomeLedger_Backup_' + d + '.json', 'application/json');
  }

  /** 从历史快照恢复：用当前密钥解密快照并整体替换内存账本，随后写盘 */
  async function restoreSnapshot(id) {
    const snap = await HL.idb.getSnapshot(id);
    if (!snap) { toast('Snapshot not found.', 'error'); return false; }
    try {
      const bytes = new Uint8Array(snap.data);
      const res = await HL.crypto.decryptLedgerWithKey(bytes, rt.key);
      state.ledger = res.ledger;
      state.saveStatus = 'dirty';
      await persistNow();
      toast('Restored snapshot from ' + new Date(snap.savedAt).toLocaleString('en-US') + '.', 'success');
      return true;
    } catch (e) {
      toast('This snapshot was saved under a different password and cannot be restored.', 'error');
      return false;
    }
  }

  /* ==================== 派生数据（只读计算，供视图绑定） ==================== */

  /** 单账户当前余额 = 期初 + Σ(收入为正/支出与转出为负/转入为正) */
  function accountBalance(accId) {
    const L = state.ledger;
    if (!L) return 0;
    const acc = L.accounts.find((a) => a.id === accId);
    if (!acc) return 0;
    let bal = acc.openingBalance;
    for (const t of L.transactions) {
      if (t.accountId === accId) {
        if (t.type === 'income') bal += t.amount;
        else bal -= t.amount; // expense 与 transfer(转出) 都减少本账户
      }
      if (t.type === 'transfer' && t.toAccountId === accId) bal += t.amount;
    }
    return U.round2(bal);
  }

  /** 净资产 = 全部账户余额之和（信用卡欠款为负自动抵扣） */
  function netWorth() {
    const L = state.ledger;
    if (!L) return 0;
    return U.round2(L.accounts.reduce((a, acc) => a + accountBalance(acc.id), 0));
  }

  /** 资产/负债拆分（账户页横幅）：信用卡负余额计入负债，正余额计入资产 */
  function assetsAndDebts() {
    const L = state.ledger;
    let assets = 0, debts = 0;
    for (const acc of L ? L.accounts : []) {
      const b = accountBalance(acc.id);
      if (acc.type === 'credit') {
        if (b < 0) debts += -b; // 欠款（负余额）取绝对值计入负债
        else assets += b;       // 多存的余额计入资产
      } else {
        assets += b;
      }
    }
    debts = U.round2(debts);
    assets = U.round2(assets);
    return { assets, debts, net: U.round2(assets - debts) };
  }

  /** 某月收支汇总：{income, expense, net} */
  function monthTotals(ym) {
    const L = state.ledger;
    let income = 0, expense = 0;
    for (const t of L ? L.transactions : []) {
      if (U.monthKey(t.date) !== ym) continue;
      if (t.type === 'income') income += t.amount;
      else if (t.type === 'expense') expense += t.amount;
    }
    income = U.round2(income); expense = U.round2(expense);
    return { income, expense, net: U.round2(income - expense) };
  }

  /** 某月各分类支出 Map（分类环形图 / 预算进度共用） */
  function spentByCat(ym) {
    const L = state.ledger;
    const map = new Map();
    for (const t of L ? L.transactions : []) {
      if (t.type !== 'expense' || U.monthKey(t.date) !== ym) continue;
      const id = t.categoryId || '_uncat';
      map.set(id, U.round2((map.get(id) || 0) + t.amount));
    }
    return map;
  }

  /** 某月某分类的预算行：{amount(当月生效额度), spent, pct, remaining, hasBudget} */
  function budgetRow(categoryId, ym) {
    const L = state.ledger;
    const b = L ? L.budgets.find((x) => x.categoryId === categoryId) : null;
    const override = b && b.overrides ? b.overrides[ym] : undefined;
    const amount = b ? (override != null ? override : b.monthlyAmount) : 0;
    const spent = (spentByCat(ym).get(categoryId) || 0);
    const remaining = U.round2(amount - spent);
    const pct = amount > 0 ? Math.round((spent / amount) * 100) : 0;
    return { hasBudget: !!b, amount, override, spent, remaining, pct };
  }

  /** 某月全部预算行（信封视图），按消耗比例降序 */
  function budgetRows(ym) {
    const L = state.ledger;
    if (!L) return [];
    return L.budgets
      .map((b) => {
        const cat = L.categories.find((c) => c.id === b.categoryId);
        return Object.assign({ cat }, budgetRow(b.categoryId, ym));
      })
      .filter((r) => r.cat)
      .sort((a, b) => b.pct - a.pct);
  }

  /** 未来 days 天内到期的账单（含状态标记），按到期日升序 */
  function upcomingBills(days) {
    const L = state.ledger;
    if (!L) return [];
    const today = U.todayISO();
    const limit = U.toISODate(new Date(Date.now() + (days || 30) * 86400000));
    return L.bills
      .filter((b) => b.nextDueDate <= limit)
      .map((b) => ({ bill: b, status: billStatus(b), daysUntil: U.daysBetween(b.nextDueDate, today) }))
      .sort((a, b) => (a.bill.nextDueDate < b.bill.nextDueDate ? -1 : 1));
  }

  /** 账单状态：overdue（过期）| due-soon（临近提醒期）| scheduled（正常排期） */
  function billStatus(bill) {
    const d = U.daysBetween(bill.nextDueDate, U.todayISO());
    if (d < 0) return 'overdue';
    if (d <= (bill.reminderDays || 3)) return 'due-soon';
    return 'scheduled';
  }

  /** 账单年化成本表（年度总览），按年成本降序 */
  function annualBills() {
    const L = state.ledger;
    if (!L) return [];
    return L.bills
      .map((b) => ({ bill: b, annual: U.round2(b.amount * (U.freqPerYear[b.frequency] || 12)) }))
      .sort((a, b) => b.annual - a.annual);
  }

  /** 最近 12 个月月份键（含当月，升序）——报表趋势图用 */
  function last12Months() {
    const cur = U.currentMonthKey();
    const out = [];
    for (let i = -11; i <= 0; i++) out.push(U.addMonthKey(cur, i));
    return out;
  }

  /** 12 个月收支序列 [{ym, income, expense}]（柱状图数据） */
  function monthsIncomeExpense(ymKeys) {
    return ymKeys.map((ym) => {
      const t = monthTotals(ym);
      return { ym, income: t.income, expense: t.expense };
    });
  }

  /** 历史收款方词汇表（交易表单自动补全） */
  function payees() {
    return U.collectPayees(state.ledger ? state.ledger.transactions : []);
  }

  /* ==================== UI 辅助 ==================== */

  /** 弹全局通知：type = success | error | info */
  function toast(msg, type, timeout) {
    const id = U.uid();
    state.toasts.push({ id, msg, type: type || 'success' });
    setTimeout(() => {
      const i = state.toasts.findIndex((t) => t.id === id);
      if (i >= 0) state.toasts.splice(i, 1);
    }, timeout || 3800);
  }

  /**
   * 全局确认框（Promise 风格）：await askConfirm('Delete?') => true/false
   * 选项：confirmText 按钮文案、danger 红色危险样式
   */
  function askConfirm(message, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      state.confirm = {
        message,
        title: opts.title || 'Are you sure?',
        confirmText: opts.confirmText || 'Confirm',
        danger: !!opts.danger,
        resolve
      };
    });
  }

  /** 关闭确认框并回传结果（由确认框组件按钮调用） */
  function answerConfirm(val) {
    if (state.confirm && state.confirm.resolve) state.confirm.resolve(val);
    state.confirm = null;
  }

  /* ==================== 空闲自动锁屏 ==================== */

  /** 记录用户活跃（pointermove/keydown 节流调用） */
  function markActivity() {
    rt.lastActivity = Date.now();
  }

  /** 启动空闲监听：每 20s 检查一次，5 分钟无操作自动锁屏（记住我模式下禁用） */
  function startIdleWatch() {
    if (rt.idleTimer) return;
    ['pointermove', 'pointerdown', 'keydown'].forEach((ev) =>
      document.addEventListener(ev, markActivity, { passive: true })
    );
    rt.idleTimer = setInterval(() => {
      const IDLE_MS = 5 * 60 * 1000;
      if (state.phase === 'main' && !state.rememberEnabled &&
          Date.now() - rt.lastActivity > IDLE_MS) {
        lockNow('Locked automatically after 5 minutes of inactivity.');
      }
    }, 20000);
  }

  // 导出 API
  HL.store = {
    state, boot, continueWithSavedHandle, openExisting,
    prepareNewLedger, commitNewLedger,
    unlock, lockNow, relocateFile, persistNow, saveByDownload,
    enableRemember, disableRemember, changePassword,
    addAccount, updateAccount, toggleAccountArchive,
    addTransaction, updateTransaction, deleteTransaction, cycleTxStatus,
    addBill, updateBill, deleteBill, markBillPaid,
    setBudget, setBudgetOverride, removeBudget,
    addCategory, deleteCategory, setCurrency, setTheme,
    exitApp,
    exportJsonBackup, restoreSnapshot,
    accountBalance, netWorth, assetsAndDebts, monthTotals, spentByCat,
    budgetRow, budgetRows, upcomingBills, billStatus, annualBills,
    last12Months, monthsIncomeExpense, payees,
    toast, askConfirm, answerConfirm, startIdleWatch
  };
})();

/* =====================================================================
 * charts.js — 手绘 SVG 图表（零依赖，样式完全可控）
 * DonutChart：分类占比环形图（hover 扇区高亮 + 提示框）
 * BarsChart ：近 12 个月收支柱状图（hover 整月提示框）
 * 提示框用 HTML 绝对定位实现（百分比坐标，容器须 position:relative）。
 * ===================================================================== */
(function () {
  'use strict';

  /** 极坐标转直角坐标（donut 扇区路径计算用） */
  function polar(cx, cy, r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  /** 生成环形扇区路径：外弧 + 内弧（donut 环块），deg 起、span 跨度 */
  function arcPath(cx, cy, rOut, rIn, deg, span) {
    const a0 = deg, a1 = deg + span;
    const large = span > 180 ? 1 : 0;
    const p1 = polar(cx, cy, rOut, a0), p2 = polar(cx, cy, rOut, a1);
    const p3 = polar(cx, cy, rIn, a1), p4 = polar(cx, cy, rIn, a0);
    return 'M' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2) +
      ' A' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2) +
      ' L' + p3.x.toFixed(2) + ' ' + p3.y.toFixed(2) +
      ' A' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + p4.x.toFixed(2) + ' ' + p4.y.toFixed(2) + ' Z';
  }

  /**
   * 环形图组件
   * props: items [{label, value, color}]；centerLabel / centerValue（圆心文案）
   * 数据为空时展示占位文案。
   */
  const DonutChart = {
    name: 'DonutChart',
    props: { items: { type: Array, default: () => [] }, centerLabel: String, centerValue: String },
    data() { return { tip: null, hover: -1, SIZE: 210 }; },
    computed: {
      /** 总量（用于份额计算；无数据时为 0） */
      total() { return this.items.reduce((a, i) => a + i.value, 0); },
      /** 计算好的扇区几何：{path, color, pct, gap 起始角} */
      arcs() {
        const out = [];
        let deg = 0;
        const GAP = this.items.length > 1 ? 1.6 : 0; // 扇区间留缝（度），更精致
        for (const it of this.items) {
          const span = this.total > 0 ? (it.value / this.total) * 360 : 0;
          if (span <= 0) continue;
          out.push({
            path: arcPath(105, 105, 96, 66, deg + GAP / 2, Math.max(0.5, span - GAP)),
            color: it.color,
            pct: Math.round((it.value / this.total) * 100),
            label: it.label,
            value: it.value
          });
          deg += span;
        }
        return out;
      }
    },
    methods: {
      /** hover 扇区：记录提示框位置（SVG 坐标转百分比）与内容 */
      onHover(a, ev) {
        const rect = ev.currentTarget.closest('.chart-wrap').getBoundingClientRect();
        this.tip = {
          x: ((ev.clientX - rect.left) / rect.width) * 100,
          y: ((ev.clientY - rect.top) / rect.height) * 100,
          label: a.label, value: a.value, pct: a.pct
        };
        this.hover = this.arcs.indexOf(a);
      },
      /** 移出扇区：清空提示 */
      onLeave() { this.tip = null; this.hover = -1; }
    },
    template: `
<div class="chart-wrap">
  <svg v-if="arcs.length" :viewBox="'0 0 ' + SIZE + ' ' + SIZE" style="width:100%;display:block">
    <path v-for="(a,i) in arcs" :key="i" :d="a.path" :fill="a.color"
      :opacity="hover === -1 || hover === i ? 1 : 0.35"
      style="transition:opacity .12s;cursor:pointer"
      @mousemove="onHover(a,$event)" @mouseleave="onLeave"/>
    <text x="105" y="100" text-anchor="middle" class="donut-center-label">{{ centerLabel }}</text>
    <text x="105" y="122" text-anchor="middle" class="donut-center-value">{{ centerValue }}</text>
  </svg>
  <div v-else class="empty" style="padding:50px 20px">No expenses recorded this month.</div>
  <div v-if="tip" class="chart-tip" :style="{ left: tip.x + '%', top: tip.y + '%' }">
    <b>{{ tip.label }}</b><br>{{ $money(tip.value) }} &middot; {{ tip.pct }}%
  </div>
</div>`
  };

  /**
   * 双柱趋势图组件
   * props: data [{ym, income, expense}]
   * 每月两根柱（收入绿 / 支出红），hover 整月出现提示框。
   */
  const BarsChart = {
    name: 'BarsChart',
    props: { data: { type: Array, default: () => [] } },
    data() { return { tip: null }; },
    computed: {
      /** y 轴最大值（取收/支较大者，向上取整到千位，保证柱高比例协调） */
      max() {
        const m = Math.max(1, ...this.data.map((d) => Math.max(d.income, d.expense)));
        const pow = Math.pow(10, String(Math.round(m)).length - 1);
        return Math.ceil(m / pow * 1.1) * pow / 1;
      },
      /** 绘图区几何常量 */
      geo() { return { x0: 44, y0: 12, w: 596, h: 150, base: 162 }; }
    },
    methods: {
      /** 单柱矩形几何：value->高度 映射 */
      barX(i, half) { const g = this.geo; const slot = g.w / this.data.length; return g.x0 + slot * i + (half ? slot / 2 + 1.5 : 4); },
      barW() { const slot = this.geo.w / this.data.length; return Math.max(6, slot / 2 - 5); },
      barH(v) { return Math.max(0, (v / this.max) * this.geo.h); },
      /** y 轴刻度线（4 条均分） */
      gridLine(i) { const g = this.geo; return { y: g.base - (g.h / 3) * i, v: this.max / 3 * i }; },
      /** hover 整月：展示收/支/净 */
      onHover(d, ev) {
        const rect = ev.currentTarget.closest('.chart-wrap').getBoundingClientRect();
        this.tip = {
          x: ((ev.clientX - rect.left) / rect.width) * 100,
          y: ((ev.clientY - rect.top) / rect.height) * 100,
          ym: d.ym, income: d.income, expense: d.expense
        };
      },
      onLeave() { this.tip = null; }
    },
    template: `
<div class="chart-wrap">
  <svg viewBox="0 0 650 190" style="width:100%;display:block">
    <g v-for="(gl,i) in [3,2,1,0]" :key="'g'+i">
      <line :x1="geo.x0" :x2="geo.x0 + geo.w" :y1="gridLine(gl).y" :y2="gridLine(gl).y"
        stroke="#e4e8ee" stroke-width="1" stroke-dasharray="3 4"/>
      <text :x="geo.x0 - 8" :y="gridLine(gl).y + 4" text-anchor="end" font-size="10" fill="#8492a6">
        {{ $numShort(gridLine(gl).v) }}
      </text>
    </g>
    <g v-for="(d,i) in data" :key="d.ym">
      <rect :x="barX(i,false)" :y="geo.base - barH(d.income)" :width="barW()" :height="barH(d.income)"
        rx="3" fill="#16a34a" opacity="0.9"/>
      <rect :x="barX(i,true)" :y="geo.base - barH(d.expense)" :width="barW()" :height="barH(d.expense)"
        rx="3" fill="#ef4444" opacity="0.9"/>
      <text :x="barX(i,false) + barW()" :y="geo.base + 16" text-anchor="middle" font-size="10" fill="#8492a6">{{ $monthShort(d.ym) }}</text>
      <rect :x="geo.x0 + (geo.w / data.length) * i" y="6" :width="geo.w / data.length" :height="geo.h + 16"
        fill="transparent" style="cursor:pointer" @mousemove="onHover(d,$event)" @mouseleave="onLeave"/>
    </g>
    <line :x1="geo.x0" :x2="geo.x0 + geo.w" :y1="geo.base" :y2="geo.base" stroke="#cdd4de" stroke-width="1"/>
  </svg>
  <div v-if="tip" class="chart-tip" :style="{ left: tip.x + '%', top: tip.y + '%' }">
    <b>{{ $monthLong(tip.ym) }}</b><br>
    <span style="color:#4ade80">&#9650;</span> Income {{ $money(tip.income) }}<br>
    <span style="color:#f87171">&#9660;</span> Expenses {{ $money(tip.expense) }}
  </div>
</div>`
  };

  HL.charts = { DonutChart, BarsChart };
})();

  const XModal = {

/* =====================================================================
 * views/wizard.js — 新建账本向导（两步）
 * 第 1 步：设置主密码（强度仪表 + 二次确认 + 可选密码提示语）
 * 第 2 步：选择账本文件保存位置（降级模式自动下载初始文件）
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.wizard = {
  name: 'WizardView',
  data() {
    return {
      pw: '', pw2: '', hint: '',          // 表单输入
      busy: false,                        // 加密进行中（PBKDF2 约 0.5s）
      err: '',                            // 错误提示
      pickedName: ''                      // 已选文件名（第 2 步展示）
    };
  },
  computed: {
    step() { return this.$s.wizardStep; },
    /** 密码强度评估（分数 0-3 + 文案） */
    strength() { return HL.util.passwordStrength(this.pw); },
    /** 第 1 步是否可继续：两次输入一致且非空 */
    canNext() { return this.pw.length >= 8 && this.pw === this.pw2; },
    /** 降级模式标志 */
    fallback() { return this.$s.fallback; }
  },
  methods: {
    /** 第 1 步 -> 第 2 步：先用主密码加密种子账本（生成密钥与密文） */
    async next() {
      this.err = '';
      if (!this.canNext) { this.err = 'Passwords do not match, or are shorter than 8 characters.'; return; }
      this.busy = true;
      try {
        await HL.store.prepareNewLedger(this.pw, this.hint.trim());
        this.$s.wizardStep = 2;
        if (this.fallback) this.pickedName = 'FamilyLedger.hledger (downloaded)';
      } catch (e) {
        this.err = 'Something went wrong while preparing encryption: ' + e.message;
      }
      this.busy = false;
    },
    /**
     * 第 2 步完成：FS 模式弹出系统保存对话框选位置；降级模式直接提交（自动下载）。
     * 用户取消选择时停留在第 2 步。
     */
    async finish() {
      this.busy = true;
      try {
        if (this.fallback) {
          await HL.store.commitNewLedger(null);
          return;
        }
        const handle = await HL.files.pickNewFile('FamilyLedger.hledger');
        if (!handle) { this.busy = false; return; }
        this.pickedName = handle.name;
        await HL.store.commitNewLedger(handle);
      } catch (e) {
        this.err = 'Could not create the file: ' + e.message;
        this.busy = false;
      }
    },
    /** 返回第 1 步修改密码 */
    back() { this.$s.wizardStep = 1; },
    /** 取消向导回到欢迎页 */
    cancel() { HL.store.state.phase = 'welcome'; }
  },

        <div class="step" :class="{on: step >= 1}"><b>1</b> Master password</div>
        <div class="line"></div>
        <div class="step" :class="{on: step >= 2}"><b>2</b> Save location</div>
      </div>

      <!-- 第 1 步：主密码 -->
      <template v-if="step === 1">
        <div class="auth-logo" style="margin-bottom:16px">
          <div>
            <div class="auth-title">Create your master password</div>
            <div class="auth-sub">This is the only key to your ledger. If it is lost, the data cannot be recovered &mdash; there is no reset link.</div>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Master password</label>
          <input class="field-input" type="password" v-model="pw" placeholder="12+ characters or 4 random words" autofocus>
          <div class="meter"><i v-for="i in 4" :key="i" :class="i <= strength.score ? 'f' + (strength.score + 1) : ''"></i></div>
          <div class="meter-label" :class="'s' + strength.score" v-if="pw">{{ strength.label }}</div>
          <div class="meter-hint" v-if="pw && strength.hint">{{ strength.hint }}</div>
        </div>
        <div class="field">
          <label class="field-label">Confirm password</label>
          <input class="field-input" type="password" v-model="pw2" placeholder="Type it again">
        </div>
        <div class="field">
          <label class="field-label">Password hint (optional, stored in plain text)</label>
          <input class="field-input" v-model="hint" maxlength="60" placeholder="e.g. our usual anniversary phrase">
          <div class="field-hint">Anyone with this file can read the hint &mdash; don't write the password itself.</div>
        </div>
        <div class="auth-error" v-if="err"><x-icon name="alert"/>{{ err }}</div>
        <div style="display:flex;gap:10px">
          <button class="btn" @click="cancel">Cancel</button>
          <button class="btn btn-primary" style="flex:1" :disabled="!canNext || busy" @click="next">
            {{ busy ? 'Encrypting…' : 'Continue' }}
          </button>
        </div>
      </template>

      <!-- 第 2 步：保存位置 -->
      <template v-else>
        <div class="auth-logo" style="margin-bottom:16px">
          <div>
            <div class="auth-title">Choose where to keep your ledger</div>
            <div class="auth-sub" v-if="!fallback">Pick a folder you trust, like Documents. The file is encrypted &mdash; opening it outside Home Ledger shows only unreadable bytes.</div>
            <div class="auth-sub" v-else>Your browser can't write files directly. The initial encrypted file will be downloaded &mdash; keep it safe, and open it here next time.</div>
          </div>
        </div>
        <div class="secure-row" style="margin-bottom:16px">
          <x-icon name="shield"/> PBKDF2 &middot; 600,000 iterations &middot; AES-256-GCM
        </div>
        <div class="auth-error" v-if="err"><x-icon name="alert"/>{{ err }}</div>
        <div style="display:flex;gap:10px">
          <button class="btn" @click="back" :disabled="busy">Back</button>
          <button class="btn btn-primary" style="flex:1" :disabled="busy" @click="finish">
            {{ busy ? 'Creating…' : (fallback ? 'Create & download' : 'Choose location & create') }}
          </button>
        </div>
        <div class="auth-foot" v-if="pickedName">Selected: <b>{{ pickedName }}</b></div>
      </template>
    </div>
  </div>
</div>`

 * unlock 模式：启动后输主密码进入；展示文件名与密码提示。
 * locked 模式：手动锁定或 5 分钟空闲自动锁；强调"已锁定"状态。
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.unlock = {
  name: 'UnlockView',
  data() { return { pw: '', err: '', busy: false, showHint: false, shake: false }; },
  computed: {
    /** 是否为锁屏模式（否则为首次解锁模式） */
    isLocked() { return this.$s.phase === 'locked'; },
    hint() { return this.$s.hint; },
    fileName() { return this.$s.fileName || this.$s.savedHandleName || 'Your ledger'; }
  },
  methods: {
    /** 提交密码解锁：成功进入主界面；密码错误时抖动提示 */
    async submit() {
      if (!this.pw || this.busy) return;
      this.busy = true;
      this.err = '';
      try {
        await HL.store.unlock(this.pw);
      } catch (e) {
        this.err = e.message === 'bad-password'
          ? 'Wrong password. Please try again.'
          : 'Could not decrypt this file (' + e.message + '). If it keeps failing, restore a snapshot from another device copy.';
        this.shake = true;
        setTimeout(() => { this.shake = false; }, 400);
      }
      this.busy = false;
      this.pw = '';
    }

/* =====================================================================
 * views/shell.js — 主框架（phase=main 时的外壳）
 * 左侧深色导航（7 模块）+ 顶栏（文件名 / 保存状态 / 锁定按钮）+ 内容路由
 * 装载后启动空闲自动锁屏监听。
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.shell = {
  name: 'ShellView',
  computed: {
    s() { return this.$s; },
    /** 当前是否为夜间模式（读账本设置，旧账本无该字段时按日间处理） */
    isNight() { return !!(this.s.ledger && this.s.ledger.settings.theme === 'night'); },
    /** 保存状态展示文案（顶栏小圆点旁） */
    saveText() {
      const m = {
        saved: 'All changes saved', saving: 'Saving…',
        dirty: this.s.fallback ? 'Unsaved — download to save' : 'Unsaved changes…',
        error: 'Save failed', idle: 'Ready'
      };
      return m[this.s.saveStatus] || '';
    }
  },
  methods: {
    /** 切换左侧导航视图 */
    go(v) { this.s.view = v; },
    /** 手动锁定（失败时 toast 提示，不锁） */
    async lock() { await HL.store.lockNow(''); },
    /** 顶栏"下载保存"（降级模式专用） */
    downloadSave() { HL.store.saveByDownload(); },
    /** 保存失败后的"重新定位文件" */
    fixLocation() { HL.store.relocateFile(); },
    /** 日间 / 夜间模式切换（写入账本设置并随文件保存） */
    toggleTheme() { HL.store.setTheme(this.isNight ? 'day' : 'night'); },
    /** 退出应用（内部含二次确认与未保存落盘） */
    exitApp() { HL.store.exitApp(); }
  },
  mounted() {
    // 启动空闲锁屏监听（记住我开启时监听器内部自动跳过）
    HL.store.startIdleWatch();
  },
  template: `
<div class="shell">
  <!-- 左侧导航 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><x-icon name="wallet" :size="17"/></div>
      <div>
        <div class="brand-name">Home Ledger</div>
        <div class="brand-sub">Private family finance</div>
      </div>
    </div>
    <nav class="nav">
      <button v-for="n in [
        ['dashboard','Dashboard','dashboard'],
        ['accounts','Accounts','bank'],
        ['transactions','Transactions','swap'],
        ['bills','Bills & Due','receipt'],
        ['budget','Budget','target'],
        ['reports','Reports','chart'],
        ['settings','Settings','gear'],
        ['guide','User Guide','info']
      ]" :key="n[0]" class="nav-item" :class="{on: s.view === n[0]}" @click="go(n[0])">
        <x-icon :name="n[2]"/>{{ n[1] }}
      </button>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-note">Encrypted at rest &middot; Works offline</div>
      <button class="nav-item" @click="lock"><x-icon name="lock"/>Lock now</button>
    </div>
  </aside>

  <!-- 右侧：顶栏 + 内容 -->
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header class="topbar">
      <div class="topbar-file">
        <x-icon name="file"/>
        <b class="ellipsis">{{ s.fileName }}</b>
      </div>
      <span class="save-dot" :class="s.saveStatus" :title="saveText"></span>
      <span style="font-size:12px" class="text-muted">{{ saveText }}</span>
      <button v-if="s.saveStatus === 'error'" class="btn btn-sm btn-danger" @click="fixLocation">Fix location</button>
      <button v-if="s.fallback" class="btn btn-sm" :disabled="s.saveStatus === 'saved'" @click="downloadSave">
        <x-icon name="download"/> Download save
      </button>
      <div class="spacer"></div>
      <span style="font-size:12px" class="text-muted">{{ $dateLong(new Date()) }}</span>
      <!-- 日间 / 夜间模式切换：图标随当前模式变化（日间显示月亮，夜间显示太阳） -->
      <button class="btn btn-sm" style="padding:6px 8px"
        :title="isNight ? 'Switch to day mode' : 'Switch to night mode'"
        :aria-label="isNight ? 'Switch to day mode' : 'Switch to night mode'"
        @click="toggleTheme">
        <x-icon :name="isNight ? 'sun' : 'moon'"/>
      </button>
      <button class="btn btn-sm" @click="lock"><x-icon name="lock"/>Lock</button>
      <!-- 退出应用：点击后弹窗确认，确认后落盘并关闭 -->
      <button class="btn btn-sm" style="padding:6px 8px" title="Exit Home Ledger" aria-label="Exit Home Ledger" @click="exitApp">
        <x-icon name="logout"/>
      </button>
    </header>
    <main class="content">
      <component :is="'view-' + s.view"></component>
    </main>
  </div>
</div>`
};

/* =====================================================================
 * views/dashboard.js — Dashboard（首页概览）
 * 四张指标卡（净资产 / 本月收入 / 本月支出 / 净现金流）
 * + 未来 30 天账单 + 预算消耗 Top5 + 账户余额一览
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.dashboard = {
  name: 'DashboardView',
  computed: {
    L() { return this.$s.ledger; },
    /** 当前月份键（本月统计口径） */
    ym() { return HL.util.currentMonthKey(); },
    /** 按时段问候（美式问候语） */
    greeting() {
      const h = new Date().getHours();
      return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    },
    /** 本月收支汇总 */
    totals() { return HL.store.monthTotals(this.ym); },
    /** 净资产 */
    worth() { return HL.store.netWorth(); },
    /** 未来 30 天到期账单（最多展示 6 条） */
    upcoming() { return HL.store.upcomingBills(30).slice(0, 6); },
    upcomingCount() { return HL.store.upcomingBills(30).length; },
    /** 预算消耗 Top 5（有额度的信封按百分比排序） */
    topBudgets() {
      return HL.store.budgetRows(this.ym).filter((r) => r.amount > 0).slice(0, 5);
    },
    /** 活跃账户（未归档）与余额条几何（以最大余额为 100%） */
    accounts() {
      const list = this.L.accounts.filter((a) => !a.archived)
        .map((a) => ({ acc: a, bal: HL.store.accountBalance(a.id) }));
      const max = Math.max(1, ...list.map((r) => Math.abs(r.bal)));
      return list.map((r) => Object.assign(r, { w: Math.max(3, Math.abs(r.bal) / max * 100) }));
    }
  },
  methods: {
    /** 账单状态徽章样式与文案 */
    badge(st) {
      return st === 'overdue' ? ['badge-red', 'Overdue']
        : st === 'due-soon' ? ['badge-amber', 'Due soon']
        : ['badge-gray', 'Scheduled'];
    },
    /** 账户类型图标背景色（类型 -> 品牌色系） */
    accColor(type) {
      return { checking: '#4f46e5', savings: '#0d9488', credit: '#dc2626', cash: '#d97706' }[type] || '#64748b';
    },
    /** 一键"标记已付"（Dashboard 快捷操作，金额/账户取账单默认） */
    async quickPay(u) {
      const ok = await HL.store.askConfirm(
        'Mark "' + u.bill.name + '" as paid for ' + this.$money(u.bill.amount) + ' from ' +
        (this.L.accounts.find((a) => a.id === u.bill.accountId) || { name: '?' }).name + '?',
        { title: 'Mark as Paid', confirmText: 'Mark as Paid' }
      );
      if (ok) HL.store.markBillPaid(u.bill.id, {});
    },
    go(v) { this.$s.view = v; }
  },
  template: `
<div class="page">
  <div class="page-head">
    <div>
      <div class="page-title">{{ greeting }}</div>
      <div class="page-sub">Here is how {{ $monthLong(ym) }} is going.</div>
    </div>
    <div class="page-actions">
      <button class="btn" @click="go('transactions')"><x-icon name="plus"/>Add transaction</button>
    </div>
  </div>

  <!-- 指标卡 -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Net worth</div>
      <div class="stat-value money">{{ $money(worth) }}</div>
      <div class="stat-sub">across all accounts</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Income · {{ $monthLong(ym).split(' ')[0] }}</div>
      <div class="stat-value money amt-pos">{{ $money(totals.income) }}</div>
      <div class="stat-sub">received this month</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Expenses · {{ $monthLong(ym).split(' ')[0] }}</div>
      <div class="stat-value money">{{ $money(totals.expense) }}</div>
      <div class="stat-sub">spent this month</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Net cash flow</div>
      <div class="stat-value money" :class="totals.net >= 0 ? 'amt-pos' : 'amt-neg'">
        {{ totals.net >= 0 ? '+' + $money(totals.net) : $money(totals.net) }}
      </div>
      <div class="stat-sub">income minus expenses</div>
    </div>
  </div>

  <div class="dash-grid">
    <div class="dash-col">
      <!-- 未来 30 天账单 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Due in the next 30 days</span>
          <a href="javascript:void(0)" style="font-size:12.5px" @click="go('bills')">All bills</a>
        </div>
        <div v-if="!upcoming.length" class="empty">
          <div class="empty-icon">🎉</div>
          Nothing due in the next 30 days.<br>Add recurring bills to see them here.
        </div>
        <div v-for="u in upcoming" :key="u.bill.id" class="bill-row">
          <div class="bill-ico">{{ (L.categories.find(c => c.id === u.bill.categoryId) || {icon:'🧾'}).icon }}</div>
          <div class="bill-main">
            <div class="bill-name ellipsis">{{ u.bill.name }}
              <span v-if="u.bill.autoPay" class="badge badge-indigo" style="margin-left:6px"><x-icon name="zap"/>AutoPay</span>
            </div>
            <div class="bill-meta">{{ u.bill.payee }}</div>
          </div>
          <div>
            <div class="bill-amt money">{{ $money(u.bill.amount) }}<span v-if="u.bill.isEstimate" class="text-muted"> ~</span></div>
            <div class="bill-due">{{ u.daysUntil < 0 ? $date(u.bill.nextDueDate) : (u.daysUntil === 0 ? 'Due today' : 'in ' + u.daysUntil + ' days') }}</div>
          </div>
          <span class="badge" :class="badge(u.status)[0]">{{ badge(u.status)[1] }}</span>
          <button class="btn btn-sm" @click="quickPay(u)">Paid</button>
        </div>
      </div>

      <!-- 账户余额 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Accounts</span>
          <a href="javascript:void(0)" style="font-size:12.5px" @click="go('accounts')">Manage</a>
        </div>
        <div v-if="!accounts.length" class="empty">
          <div class="empty-icon">🏦</div>
          No accounts yet. Add your checking or credit card to get started.
        </div>
        <div v-for="r in accounts" :key="r.acc.id" class="acct-bal-row">
          <div class="acct-bal-top">
            <span style="font-weight:600">{{ r.acc.name }}</span>
            <b class="money" :class="r.bal < 0 ? 'amt-neg' : ''">{{ $money(r.bal) }}</b>
          </div>
          <div class="acct-bal-bar"><i :style="{ width: r.w + '%', background: accColor(r.acc.type) }"></i></div>
        </div>
      </div>
    </div>

    <div class="dash-col">
      <!-- 预算消耗 Top 5 -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">Budgets this month</span>
          <a href="javascript:void(0)" style="font-size:12.5px" @click="go('budget')">All budgets</a>
        </div>
        <div v-if="!topBudgets.length" class="empty">
          <div class="empty-icon">🎯</div>
          No budgets yet. Set monthly envelopes to track spending.
        </div>
        <div v-for="r in topBudgets" :key="r.cat.id" style="padding:12px 20px;border-bottom:1px solid var(--border)">
          <div class="env-top">
            <span class="env-cat">{{ r.cat.icon }} {{ r.cat.name }}</span>
            <span class="env-nums">{{ $money(r.spent) }} of {{ $money(r.amount) }}</span>
          </div>
          <div class="progress">
            <i :class="r.pct > 100 ? 'over' : r.pct >= 75 ? 'warn' : 'ok'" :style="{ width: Math.min(100, r.pct) + '%' }"></i>
          </div>
        </div>
      </div>

      <!-- 快捷安全卡 -->
      <div class="card card-pad">
        <div class="card-title" style="margin-bottom:10px">Your data, your rules</div>
        <div class="secure-row" style="margin-bottom:8px"><x-icon name="shield"/>Ledger file is encrypted with AES-256-GCM</div>
        <div class="secure-row" style="margin-bottom:8px"><x-icon name="check"/>Automatic snapshots keep the last 3 saves</div>
        <div class="secure-row"><x-icon name="key"> </x-icon>Change password or export backups in Settings</div>
      </div>
    </div>
  </div>
</div>`
};

/* =====================================================================
 * views/bills.js — Bills & Due（循环账单）
 * 到期排序列表 + 状态徽章（Overdue/Due soon/Scheduled + AutoPay）
 * 「Mark as Paid」弹窗（实付金额可改）+ 年度账单总览
 * ===================================================================== */
HL.views = HL.views || {};
HL.views.bills = {
  name: 'BillsView',
  data() {
    return {
      modal: null,       // 当前弹窗：'bill' 新增/编辑账单 | 'pay' 标记已付 | null
      editId: null,      // 编辑中的账单 id
      payTarget: null,   // 标记已付的账单对象
      payForm: { amount: 0, accountId: '', date: '' },
      form: null         // 账单表单对象
    };
  },
  computed: {
    L() { return this.$s.ledger; },
    /** 按到期日升序的全部账单（附状态） */
    rows() {
      return this.L.bills
        .map((b) => ({ bill: b, status: HL.store.billStatus(b) }))
        .sort((a, b) => (a.bill.nextDueDate < b.bill.nextDueDate ? -1 : 1));
    },
    /** 汇总指标：年化总额 / 30 天内到期笔数与金额 / 逾期笔数 */
    statAnnual() {
      return HL.store.annualBills().reduce((a, r) => a + r.annual, 0);
    },
    statDue30() {
      return HL.store.upcomingBills(30);
    },
    statOverdue() {
      return this.rows.filter((r) => r.status === 'overdue').length;
    },
    /** 年度总览（年化成本降序） */
    annual() { return HL.store.annualBills(); },
    /** 可选账户（未归档）与支出分类 */
    accounts() { return this.L.accounts.filter((a) => !a.archived); },
    expCats() { return this.L.categories.filter((c) => c.group !== 'Income'); }
  },
  methods: {
    badge(st) {
      return st === 'overdue' ? ['badge-red', 'Overdue']
        : st === 'due-soon' ? ['badge-amber', 'Due soon']
        : ['badge-gray', 'Scheduled'];
    },
    /** 频率显示名（模板不能直接访问 HL 全局，经方法中转） */
    freqLabel(f) { return HL.util.freqLabel[f] || f; },
    /** 频率选项表（新增/编辑弹窗下拉） */
    freqOptions() { return HL.util.freqLabel; },
    /** 打开新增/编辑账单弹窗 */
    openBill(b) {
      this.editId = b ? b.id : null;
      this.form = b ? Object.assign({}, b) : {
        name: '', payee: '', categoryId: this.expCats[0] ? this.expCats[0].id : '',
        accountId: this.accounts[0] ? this.accounts[0].id : '',
        amount: 0, isEstimate: false, frequency: 'monthly',
        nextDueDate: HL.util.todayISO(), autoPay: false, reminderDays: 3, url: ''
      };
      this.modal = 'bill';
    },
    /** 保存账单表单（简单必填校验） */
    saveBill() {
      if (!this.form.name || !this.form.amount || this.form.amount <= 0 || !this.form.nextDueDate) {
        HL.store.toast('Name, amount and next due date are required.', 'error');
        return;
      }
      if (this.editId) HL.store.updateBill(this.editId, this.form);
      else HL.store.addBill(this.form);
      this.modal = null;
    },
    /** 打开"标记已付"弹窗（预填账单金额/账户与到期日） */
    openPay(u) {
      this.payTarget = u.bill;
      this.payForm = {
        amount: u.bill.amount,
        accountId: u.bill.accountId,
        date: u.bill.nextDueDate < HL.util.todayISO() ? HL.util.todayISO() : u.bill.nextDueDate
      };
      this.modal = 'pay';
    },
    /** 确认标记已付：生成交易并推进下个到期日 */
    confirmPay() {
      if (!this.payForm.amount || this.payForm.amount <= 0 || !this.payForm.accountId) {
        HL.store.toast('Amount and account are required.', 'error');
        return;
      }
      HL.store.markBillPaid(this.payTarget.id, this.payForm);
      this.modal = null;
      HL.store.toast('Payment recorded. Next due: ' + HL.util.fmtDate(this.payTarget.nextDueDate) + '.', 'success');
    },
    /** 删除账单（确认框） */
    async remove(u) {
      const ok = await HL.store.askConfirm(
        'Delete "' + u.bill.name + '"? Past payments stay in Transactions.', { danger: true, confirmText: 'Delete' }
      );
      if (ok) HL.store.deleteBill(u.bill.id);
    }
  },
  template: `

      <div class="page-sub">Recurring bills with automatic due-date tracking.</div>

  <div class="chips">

    <div v-for="u in rows" :key="u.bill.id" class="bill-row">

      <div class="bill-main">

          <span v-if="u.bill.autoPay" class="badge badge-indigo" style="margin-left:6px"><x-icon name="zap"/>AutoPay</span>
        </div>
        <div class="bill-meta">

      </div>
      <div>
        <div class="bill-amt money">{{ $money(u.bill.amount) }}<span v-if="u.bill.isEstimate" class="text-muted"> ~</span></div>
        <div class="bill-due">Due {{ $date(u.bill.nextDueDate) }}</div>
      </div>
      <span class="badge" :class="badge(u.status)[0]">{{ badge(u.status)[1] }}</span>
      <div class="row-actions" style="opacity:1">
        <button class="btn btn-sm" @click="openPay(u)">Mark as paid</button>
        <button class="icon-btn" @click="openBill(u.bill)"><x-icon name="pencil"/></button>
        <button class="icon-btn danger" @click="remove(u)"><x-icon name="trash"/></button>
      </div>
    </div>
  </div>

  <!-- 年度账单总览 -->
  <div class="card" v-if="annual.length">
    <div class="card-head"><span class="card-title">Annual overview</span><span class="text-muted" style="font-size:12px">What each bill costs per year</span></div>
    <div v-for="r in annual" :key="r.bill.id" class="bill-row">
      <div class="bill-main">
        <div class="bill-name">{{ r.bill.name }}</div>
        <div class="bill-meta">{{ freqLabel(r.bill.frequency) }} &times; {{ $money(r.bill.amount) }}</div>
      </div>
      <div class="bill-amt money">{{ $money(r.annual) }}<div class="bill-due">per year</div></div>
    </div>

  <!-- 新增/编辑账单 -->
  <x-modal v-if="modal === 'bill'" :title="editId ? 'Edit bill' : 'Add bill'" @close="modal = null">
    <div class="field-row">
      <div class="field"><label class="field-label">Bill name</label>
        <input class="field-input" v-model="form.name" placeholder="Electric – Georgia Power"></div>
